[project]
name = "retention"
version = "0.0.1"
description = "Retention decision engine: who will churn, when, why, and what to do about it."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# "core" group: everything the data pipeline needs.
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "python-dotenv>=1",
    "kaggle>=1.6",
    "py7zr>=0.21",
]

[dependency-groups]
# "training": what the baseline and survival models need. Installed by
# `make setup` and CI. The later-phase packages stay in "models", which
# includes this group.
training = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "lifelines>=0.29",
    "scikit-survival>=0.23",
    "mlflow>=2.14",
    "ruptures>=1.1",
]
models = [
    {include-group = "training"},
    "shap>=0.46",
    "umap-learn>=0.5",
    "econml>=0.15",
    "dice-ml>=0.11",
    "ortools>=9.10",
]
serving = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5",
    "streamlit>=1.36",
    "evidently>=0.4",
    "prefect>=2.19",
    "httpx>=0.27",
]
# "api": what the scoring service and the replay need, and nothing else. Installed
# by `make setup`, CI and the API image (which does not install "training").
# The redis client talks to Valkey.
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "psutil>=7.2",
]
# "dashboard": the Streamlit app, which reads only the API (httpx is its client).
dashboard = [
    "streamlit>=1.36",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.27",  # FastAPI's test client
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retention"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Explicit, so import sorting does not depend on where the repo is cloned.
known-first-party = ["retention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "random2000: the random 2,000-row /score equality test; runs in CI, or alone with -m random2000",
]
