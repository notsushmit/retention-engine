name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install Python, dev and training dependencies
        run: |
          uv python install 3.11
          uv sync --group dev --group training --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
