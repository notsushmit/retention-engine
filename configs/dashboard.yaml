# Phase 9: the dashboard. Registered before any dashboard code or run, committed alone.
# No value here is changed after a result is seen: a later change is a logged
# amendment under a new key, and the registered entry stays as it is.
# The design tokens (hex values, font names, font files and their licences) are not
# in this commit: they are registered in their own key, in their own commit, before
# any dashboard code (step 3). Everything else about the look is registered here.

label: registered before any dashboard code, endpoint code or run

# --- what the dashboard may read ----------------------------------------------------------
source:
  only: the scoring API over HTTP  # no Valkey client, no DuckDB, no Parquet or CSV reader, no file under data/
  api_url:
    env: RETENTION_API_URL
    default: "http://127.0.0.1:8000"
    loopback_only: true  # the client refuses any host other than 127.0.0.1, localhost or [::1]
  calls:  # nothing else; any other path or method is refused by the client
    - GET /health
    - GET /at-risk
    - GET /alerts
    - GET /summary
    - GET /plans
    - GET /model
    - POST /score
  never_imported: [redis, duckdb, pyarrow, retention]  # the dashboard package imports none of these
  never_called: [pandas.read_parquet, pandas.read_csv, open on any path under data/]
  client_timeout_seconds: 10
  errors_shown_as: the API's own error detail and reason, never a number in its place

serve:
  command: make dashboard  # streamlit run, server address 127.0.0.1 only
  address: 127.0.0.1
  port: 8501
  telemetry: off  # browser.gatherUsageStats false
  hosted: none in this phase  # Phase 10: check the KKBox data terms; hosting needs the API hosted too

# --- on every page ---------------------------------------------------------------------------
every_page:
  banner: "Replay of 2016 data, not real-time."  # same place on every page, above the breadcrumb
  breadcrumb: "<group> / <page>"
  store_date_line: "Store date <store_date> (one date per loaded snapshot; no daily dates)"  # where a "last updated" line would go
  footer_disclaimers: serving.yaml wording.fixed_disclaimers  # all four, verbatim, on every page
  money_unit: "price units"  # every money figure; no conversion and no currency control
  not_ready: the /health reason shown in place of every number; no figure from an earlier answer is shown
  replay_progress:
    running: "<consumed> of <expected_events> events replayed"
    none: "no replay running"  # when produced and consumed are both 0; never "0 of 0"

# --- pages -------------------------------------------------------------------------------------
navigation:  # left sidebar, grouped
  - group: Who to act on
    pages: [overview, at_risk_list, customer_profile]
  - group: What the model sees
    pages: [model_sees, action_planner]
  - group: Can I trust it
    pages: [model_health]

pages:
  overview:
    title: Overview
    calls: [GET /health, GET /at-risk, GET /alerts, GET /summary]
    shows:
      - the store date, readiness and replay progress
      - the population counts (scored, outside the population by code, not active)
      - three expected-count buckets (days 1 to 7, 8 to 30, 31 to 59) on one panel with the customers outside the population
      - the knowable trend alerts with their three labels and the number hidden by rule
      - the top 20 at risk at 30 days
      - reason-group shares among the 1,000 customers most at risk, labelled so
    big_number: the expected count in days 1 to 7
    takeaway: "About <expected_1_7> of <scored> scored customers are expected to lapse in the next 7 days"
    shows_customer_ids: true  # the top 20 and the cancel events
  model_sees:
    title: What the model sees in at-risk customers
    never_titled: ["why customers leave", causes, "reasons customers leave"]
    calls: [GET /summary]
    shows:
      - reason-group share at 7 and 30 days by main segment (paid, discount100_only), one store date; a heatmap
      - the number of cells suppressed under the minimum cell size
    big_number: the most common first reason group at 30 days, as a share
    takeaway: "Among the 1,000 customers most at risk at 30 days, <group> is the reason the model lists first most often"
    shows_customer_ids: false
  at_risk_list:
    title: At-risk list
    calls: [GET /at-risk]
    paged: {limit_max: 1000, default: 50}
    sort: the API's order only (final probability, descending; ties by ID)  # no client-side re-ranking
    export: CSV of the displayed rows only, with columns store_date and horizon added
    big_number: the number of customers matching the filters
    takeaway: "<matching> customers match; the list is ordered by the final <horizon>-day probability"
    shows_customer_ids: true
  customer_profile:
    title: Customer profile
    calls: [POST /score]
    shows:
      - the three probabilities as three points (7 and 30 days in the normal style; 59 days in the demonstration style)
      - the two reasons, with "Reasons explain the probability before the ordering fix."
      - expected paid days in days 31 to 90 with its registered labels
      - the action block with every label (see actions)
      - the outside-population code or not_active answer, as served
    big_number: the final 30-day probability
    takeaway: "<text of the 30-day probability> chance of lapsing within 30 days"
    shows_customer_ids: true
  action_planner:
    title: Action planner
    calls: [GET /plans]
    shows:
      - the precomputed plan per registered budget level for the store's date
      - the strategy comparison with its registered caption
    plan_label: "precomputed in Phase 7 from the 30-day probability before the ordering fix; not re-planned"
    no_optimizer_call: true
    big_number: the optimizer's net value at the 5,000 budget
    takeaway: "Under the assumed relative base effect, the 5,000 budget plan contacts <contacted> customers"
    shows_customer_ids: false
  model_health:
    title: Model health
    calls: [GET /health, GET /model]
    shows:
      - the registered model and version, the eight file hashes, the config hash
      - the calibration table before and after the ordering fix (7 and 30 days)
      - "drift: not monitored (Phase 10)"
    big_number: the 30-day calibration slope after the fix
    takeaway: "Model version <version>; every file matches its registered hash"  # only when model_checksums_match is true
    shows_customer_ids: false

# --- sidebar filters ---------------------------------------------------------------------------------
filters:
  allowed: [auto_renew, in_plan, horizon]  # applied only to GET /at-risk calls
  auto_renew: [any, "on", "off"]
  in_plan: [any, "true", "false"]  # disabled with "no plan for this date" when the date has no plan
  horizon: [7, 30, 59]  # 59 carries the demonstration badge in the control's label
banned_controls:  # a test fails if any widget's label, key or option contains one (whole word, any case)
  never_used: serving.yaml wording.never_used  # age, gender, registered_via, tenure, city
  words: [region, segment filter, date range, currency, what-if, budget input, optimize, re-plan]
  no_store_date_picker: true  # one store date per loaded snapshot; no daily dates

# --- the handoff items --------------------------------------------------------------------------------
handoff:
  region: dropped; no region control anywhere (item 1)
  buckets:  # item 2
    source: c01 final probabilities (after the ordering fix), from GET /summary
    days_1_7: sum of p7
    days_8_30: sum of p30 - p7
    days_31_59: sum of p59 - p30  # demonstration
    population: scored customers only
    label: "expected counts from the final probabilities, scored customers only"
    beside: the customers outside the population (22% of active customers on 2016-11-01), on the same panel
    not_from: dt01  # no survival-curve bucket is shown
  replanning: none (item 3)
  what_if:  # item 4
    control: none
    line: "Counterfactuals cover 2.7% of explained rows and are model scores, not effects."
  actions:  # item 5: from the API's action block, on every page that shows an action
    tag: "assumed effect"
    tag_hover: "The plan is unstable under 5 of 11 variants."
    visible: [effect_basis, scenario, instability_note, no_estimate_line]
  days_59:  # item 6
    style: demonstration
    badge: "demonstration"
    never: [st.metric, the 7-day and 30-day style, a big number, a bucket card]

# --- labels used verbatim ---------------------------------------------------------------------------------
labels:
  alerts: serving.yaml api.alerts.trend.labels  # "exploratory", "false-alarm rate not validated", "detected in hindsight on the series through 2016-12-19"
  event: serving.yaml api.alerts.event.label
  plan_field: serving.yaml api.at_risk.plan_label
  reason_shares: "among the 1,000 customers most at risk at <horizon> days"
  suppressed: "<n> cells with fewer customers than the minimum are not shown"
  drift: "drift: not monitored (Phase 10)"
  calibration: "descriptive, no pass mark; selection half of 2016-10-01"
  no_calibration_59: "no 59-day row: its calibration was judged only in the Phase 3 59-day demonstration"
  strategy_caption: actions.yaml strategies.table_caption
  effect_prefix: actions.yaml wording.sentence_prefix  # every sentence with an effect, a retained value or a net value
  random_range: actions.yaml strategies.random.range_label

# --- tooltips -----------------------------------------------------------------------------------------------
tooltips:
  rule: every number shown has a tooltip naming its calculation and its API field
  how: the help argument of st.metric, st.markdown, st.header or the table column config; never a hover-only element without a text alternative
  source: a tooltip catalog in the dashboard code, keyed by API field; a test fails any number without an entry

# --- public captures --------------------------------------------------------------------------------------------
captures:
  rule: no page that shows a customer ID is captured for the public repo or video until the user confirms the KKBox data terms
  refused: every page with shows_customer_ids true  # overview, at_risk_list, customer_profile
  allowed: [model_sees, action_planner, model_health]
  script: refuses a refused page by name, with a test

# --- wording ---------------------------------------------------------------------------------------------------------
wording:
  extends: [configs/actions.yaml wording_rules, configs/serving.yaml wording]  # both banned lists and their exceptions stay in force
  scope: [every fixed string in the dashboard code, this file's labels and page texts, README section Dashboard, docs/dashboard.md]
  real_time_exception: "Replay of 2016 data, not real-time."  # exact string only; any other "real-time" fails
  horizon_59: "59 days"  # never "60 days"

# --- the look (tokens registered separately, before step 3) ---------------------------------------------------------------
design:
  reference: the user's two slides (cream background, near-black text, one orange accent, grotesk headings, italic serif for the one big number, monospace uppercase labels)
  never: [glassmorphism, glows, gradients, neon palettes, ticker bars, green or red delta pills, shadows]
  theme: light, cream background
  styling: .streamlit/config.toml and one small CSS file; no other styling layer
  colours:
    roles: [background (cream), ink (near-black), accent (orange, fills and badges, risk only), rust (orange text), greys]
    other_hues: none
    test: the CSS and the theme use no colour outside the registered tokens
  fonts:
    roles:
      grotesk: headings and body
      serif_italic: the one big number per page only
      mono: small uppercase labels, footers, IDs
    self_hosted: true  # no CDN or font-service request
    licence: open (OFL or similar), each reported
  layout: [left sidebar with grouped navigation, breadcrumb, banner in the same place on every page, store date line, wide margins, one big number then one chart then one table, page header states the takeaway]
  charts:
    allowed: [bar, line, dot, table, heatmap]  # one heatmap only, on model_sees
    never: [pie, donut, radar, 3D, stacked area]
    legends: none; direct labels
    orange: only on at-risk items; everything else grey
  components:
    days_59: muted grey, dashed outline, "demonstration" badge
    action_tag: small "assumed effect" tag with the instability note on hover and in text
  streamlit_version: pinned in uv.lock; the CSS selectors may break on an upgrade
  tokens: registered in their own key and commit before step 3 (hex values sampled from the slides, font names given by the user)

# --- the reason heatmap (added after the first real /summary call, before any dashboard code) ---------
heatmap_rules:
  label: >-
    the user's rules of 2026-10-22, registered before any dashboard code, after one real
    /summary call at 2016-11-01 (not a mark); the registered top_n (1,000) and minimum cell
    size (20) in configs/serving.yaml are unchanged
  totals: none beside the heatmap  # no row total, no column total, no segment count, no "all" row shown next to it
  cell_text: "Share of at-risk customers whose top raising reason is <group>"  # at-risk: the 1,000 most at risk at the horizon
  attribution_line: "Reasons are model attributions, not causes."  # shown on the page, verbatim
  attribution_exception: >-
    the attribution line is a fixed disclaimer: exact string only, removed before the
    banned-word scan as configs/actions.yaml does for its fixed disclaimers; any other
    "causes" fails
  body_note: >-
    the /summary body itself carries segment totals and an "all" segment (paid plus
    discount100_only), so a suppressed cell can be derived from the body; the page shows
    neither, and the body is not changed

# --- design tokens (sampled from the reference slide, registered before any dashboard code) -----------
design_tokens:
  label: >-
    sampled on 2026-10-22 with Pillow and NumPy from the user's reference slide (a private
    1600 x 882 RGB PNG, never committed); registered before any dashboard code
  method:
    fills: per-channel median of every pixel in a box inside one flat fill
    text: >-
      per-channel median of the darkest 5% of pixels (by Rec. 709 luminance) in a box
      around the text, so anti-aliased edges are left out; the value moves with the
      percentile (2% and 10% are reported beside it in the decision log)
    rounding: nearest integer per channel
  colours:  # hex, box (x0, y0, x1, y1) in slide pixels, method
    background: {hex: "#F4EDE3", box: [1200, 20, 1580, 200], method: fills}  # cream
    ink: {hex: "#090B0E", box: [80, 250, 680, 400], method: text}  # the big italic number
    accent: {hex: "#FE5A00", box: [130, 592, 270, 608], method: fills}  # orange; fills and badges only, risk only
    rust: {hex: "#942A11", box: [88, 60, 250, 84], method: text}  # the "THE PROBLEM" label; any orange text
    card_grey: {hex: "#1B222C", box: [296, 560, 309, 660], method: fills}
    bar_grey: {hex: "#40454B", box: [130, 518, 270, 533], method: fills}
    body_grey: {hex: "#413A31", box: [730, 300, 1360, 410], method: text}
    label_grey: {hex: "#514A40", box: [88, 815, 600, 842], method: text}
  contrast_on_background:  # WCAG 2 ratio against #F4EDE3
    ink: 16.95
    rust: 6.95
    body_grey: 9.64
    label_grey: 7.52
    accent: 2.71  # below 4.5: never used for text
  other_colours: none  # the CSS and the theme use only these eight; white and black are not tokens
  fonts:  # names given by the user; files self-hosted under dashboard/static/fonts with their licence texts
    grotesk: {family: Space Grotesk, weights: [regular, bold], source: github.com/floriankarsten/space-grotesk}
    serif_italic: {family: Instrument Serif, style: italic, source: github.com/Instrument/instrument-serif}
    mono: {family: JetBrains Mono, weights: [regular], source: github.com/JetBrains/JetBrainsMono}
    formats: WOFF2 where the repository ships it, otherwise TTF or OTF; no conversion
    licence: open (OFL or similar), confirmed from the files; anything else stops the step

# --- change C1: the reason heatmap replaced (a new key; registered entries above are kept, not edited) ---
heatmap_replaced:
  id: C1
  date: "2026-10-22"
  label: "found after a result (D-255: the heatmap showed 1 group at 7 days and 3 at 30 days)"
  amends: [pages.model_sees, navigation, heatmap_rules, design.charts.allowed, captures.allowed]  # kept as registered; this entry governs
  overview_bars:
    where: the Overview page, one panel
    charts: one bar chart per horizon, 7 days and 30 days
    data: GET /summary reasons, segment "all" only  # the top 1,000 at that horizon, both main segments together
    bar: one per first raising group, its share of the top 1,000
    colour: accent on the leading group only (the most customers; ties by group name); bar_grey for every other bar
    wording: "Share of at-risk customers whose top raising reason is <group>"  # moved from heatmap_rules.cell_text
    attribution_line: "Reasons are model attributions, not causes."  # moved from heatmap_rules; still the one exact-string exception
    sentence:
      generated: from the /summary body at render time, never typed
      one_group: "At <horizon> days all <population> share <group> as their first group"  # when one group holds every customer
      several_groups: "At <horizon> days <group> leads with <customers> of <population>"  # an addition beside the user's sentence, for the case of more than one group
  pages_after:
    dropped: model_sees  # "What the model sees in at-risk customers"
    remaining: [overview, at_risk_list, customer_profile, action_planner, model_health]  # five pages
    navigation:
      - group: Who to act on
        pages: [overview, at_risk_list, customer_profile]
      - group: What to do
        pages: [action_planner]
      - group: Can I trust it
        pages: [model_health]
    captures_allowed: [action_planner, model_health]  # overview, at_risk_list and customer_profile show customer IDs
  heatmap: none anywhere
  suppression:
    min_cell_size: 20  # configs/serving.yaml dashboard_endpoints.summary.reasons.min_cell_size, unchanged
    applies_to: every bar; a suppressed bar is drawn with no value and reads "fewer than 20"
    nature: a display rule, not a disclosure control  # stated in docs/dashboard.md and the README Dashboard section
    totals: none beside the bars  # as heatmap_rules.totals
  summary_body: unchanged  # no schema is amended; the body still carries segment totals and per-segment cells
  timeouts:
    summary_seconds: 30  # GET /summary only (its first call computes the reasons; 5.370 s on 2016-11-01, D-255)
    summary_first_load: a "computing" state until the answer arrives
    every_other_call: source.client_timeout_seconds  # 10, unchanged

# --- change C2: the user's step 3 conditions (a new key; registered entries above are kept, not edited) ---
step3_conditions:
  id: C2
  date: "2026-10-22"
  label: the user's conditions on approving step 3, registered before any dashboard code
  capture_mode:
    parameter: "capture=1"  # a query parameter of the dashboard URL
    overview: omits the top-20 table and the cancel events; nothing else changes
    other_pages: unchanged
    test: no customer ID from the fake API's answers appears anywhere in the rendered Overview in capture mode
    script:  # scripts/capture_pages.py
      allowed: {overview: "capture=1 only", action_planner: always, model_health: always}
      refused: [at_risk_list, customer_profile]
    screenshots: taken by hand by the user in step 4; no capture tool is installed
    docs: the capture-mode rule and the refusals are stated in docs/dashboard.md (step 5)
  contrast:
    accent: fill only; never text  # 2.71:1 on the background (design_tokens.contrast_on_background)
    bar_labels: every bar carries its value as a direct label in ink
    leading_group: named in the generated sentence
    test: no accent colour in any text rule of the CSS or any text mark of a chart; every bar chart has direct labels
  overview_layout:  # replaces pages.overview's order; its contents stay as registered and as C1
    order:
      - the big number
      - the three bucket figures with the customers outside the population (22%)
      - one chart with two panels, 7 and 30 days (C1's bars)
      - two tabs, "Alerts" (each trend alert with the three registered labels) and "Top 20 at risk"
    keep: ["no replay running", the computing state of /summary]
  tooltips:
    source: every calculation text is derived from registered text in configs/ (dashboard.yaml, serving.yaml, actions.yaml); no new numeric claim
    test: every number in a tooltip appears in a config or a run report; every tooltip passes the wording rules
  several_groups_sentence: "At <horizon> days <group> leads with <customers> of the top 1,000 at risk"  # amends heatmap_replaced.overview_bars.sentence.several_groups; <population> named as the top 1,000 at risk

# --- change C3: the application name (a new key; registered entries above are kept, not edited) ------
app_name:
  id: C3
  date: "2026-10-22"
  label: the user's request after the step 4 run, registered before the code that shows it
  text: "Retention Decision Engine"
  where: top of every page, above the replay banner; the banner keeps its place relative to the breadcrumb
  font: grotesk (Space Grotesk), bold, ink  # the registered heading role (design.fonts.roles.grotesk)
  browser_tab_title: "Retention Decision Engine"

# --- change C4: the application name moved to the header bar (a new key; C3 is kept, not edited) -----
app_name_header:
  id: C4
  date: "2026-10-22"
  label: the user's request after seeing C3 on the page, registered before the code that moves it
  amends: app_name.where  # C3 kept as registered; this entry governs the placement
  where: >-
    the header bar across the top of every page (fixed, above the sidebar and the main
    content); the replay banner becomes the first line of the main content
  size: larger than C3's line, about the size of a page heading
  font: grotesk (Space Grotesk), bold, ink  # unchanged from C3
  clicks: the bar lets clicks through (the sidebar control underneath keeps working)

# --- change C5: each bucket's share of the scored customers (a new key; entries above kept) ---------
bucket_shares:
  id: C5
  date: "2026-10-24"
  label: the user's request after the step 5 docs, registered before the code that shows it
  where: under each of the three bucket figures on the Overview (days 1 to 7, 8 to 30, 31 to 59)
  calculation: the bucket's expected count divided by buckets.population (the scored customers), from the same /summary answer
  decimals: 1  # a percentage with one decimal
  text: "<share> of the <scored> scored customers, expected (a sum of probabilities, not a headcount)"
  days_31_59: inside the demonstration box, in its muted style; never a metric card
  tooltip: "/summary buckets: the bucket's expected count / buckets.population (scored customers only)"

# --- change C6: the bucket shares beside their numbers, in the serif (a new key; C5 kept) ----------
bucket_shares_beside:
  id: C6
  date: "2026-10-24"
  label: the user's request after seeing C5 on the page (the shares were hard to see), registered before the code
  amends: [bucket_shares.where, bucket_shares.text, design.fonts.roles.serif_italic]  # kept as registered; this entry governs
  share: right beside each bucket's number, as "<share>"
  font: serif italic (Instrument Serif), bold, ink  # bold is synthesized: only the regular italic file is self-hosted
  days_31_59: beside its number inside the demonstration box, serif italic, label_grey, not bold  # never the 7/30-day style
  note_below: "of the <scored> scored customers, expected (a sum of probabilities, not a headcount)"  # small, under each bucket
  serif_roles_after: [the one big number per page, the Overview bucket shares]
  tooltip: bucket_shares.tooltip  # unchanged
