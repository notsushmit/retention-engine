# Evaluation protocol for the churn models: time split, calibration slice,
# validation folds, baselines, success criteria and the rule for choosing
# between candidate models.
#
# Fixed on 2026-10-11, before any model was scored on a 2017 snapshot and before
# any 2017 outcome was read for modelling. Nothing in this file is changed after
# the test months are scored. Every model choice (family, hyperparameters,
# feature-group ablations, imputation, calibration method) is made on the
# validation folds and the check month only, then frozen; the test months are
# scored once, at the end.

seed: 20161001

# Population and labels. P2 = customers whose effective expiry falls within 30
# days of the snapshot date T (labels column in_exp30); P1 = every customer with
# coverage at T. The main population is the paid and 100%-discount-only
# segments; trial_only and promo_only customers are reported separately and
# never pooled into a headline number.
population:
  primary: p2
  secondary: p1
  main_segments: [paid, discount100_only]
  label_family: coverage  # churned_7/30/60, days_to_event, event_observed
  # Evaluated horizons. 59 is the demonstration target (lapse by day 59),
  # derived from event_observed and days_to_event; churned_60 is not used.
  horizons: [7, 30, 59]

# Purge rule. A snapshot T may be used to fit or calibrate a model that is judged
# at date D only if it is fully observed at D: T + h + purge_days_after_horizon
# <= D. Its labels are built with as_of = D, never with a later as_of.
# Snapshots must also be usable for h (snapshot_usable_h in the feature table).
purge_days_after_horizon: 30

# Stop-day convention, as in the labeller: follow-up of snapshot T stops on day
# C = min(T + 90, as_of - 30) - T, the same day for every row of a snapshot
# (2016-08 to 2016-12: day 90; 2017-01: day 59; 2017-02: day 28, by formula).
# A lapse on day C or earlier is observed (inclusive, like the last labelable
# expiry as_of - 30); a row censored at C is known lapse-free through day C.
# Unit tests: a lapse on day C, a lapse on day C - 1, a customer followed
# exactly to C. Evaluating at t > C raises an error.
stop_day_inclusive: true

# Real-data label check, before any fold is scored: for each 2016 snapshot
# scored or fit by a fold (2016-08, 09, 10, 11) and each horizon, build labels
# at the earliest fully observed as_of (T + h + 30) and compare churned_h with
# the labels at 2017-03-31; also event_observed and days_to_event of the fit
# snapshots 2016-08 and 2016-09 at as_of 2017-01-01 (both followed the full 90
# days). They must be identical; the number of differing rows is reported, and
# any difference stops the work.
label_as_of_check: {snapshots: [2016-08-01, 2016-09-01, 2016-10-01, 2016-11-01], horizons: [7, 30, 59]}

# The 2016-10-01 snapshot is split by customer, using the same bucket as the
# sample (first 8 hex digits of md5(msno) mod 100): even buckets are scored by
# the validation folds (selection half), odd buckets fit the calibrator of the
# test pipeline (calibration half). The split depends only on the customer ID.
# P2 main rows: selection 72,395, calibration 72,601.
# The halves share the month's conditions, so the split separates customers,
# not months: a mild dependence, stated in the report.
customer_halves:
  snapshot: 2016-10-01
  selection: even
  calibration: odd

# Validation folds. Each fold builds its labels with as_of = its date and uses
# only snapshots fully observed at that date.
folds:
  f7a:
    horizon: 7
    as_of: 2016-10-01
    fit: [2016-08-01]
    score: {snapshot: 2016-10-01, half: selection}
    decides: discrimination
  f7b:
    horizon: 7
    as_of: 2016-11-01
    fit: [2016-08-01, 2016-09-01]
    score: {snapshot: 2016-11-01}  # also the check month
    decides: discrimination
  f7b_cal:
    horizon: 7
    as_of: 2016-11-01
    fit: [2016-08-01]
    calibration: {snapshot: 2016-09-01}
    score: {snapshot: 2016-11-01}
    decides: calibration_method
  f30:
    horizon: 30
    as_of: 2016-10-01
    fit: [2016-08-01]
    score: {snapshot: 2016-10-01, half: selection}
    decides: discrimination
# 59 days has no fold: no usable snapshot is fully observed 89 days before a
# usable scoring month. The 59-day model inherits the 30-day choices.

# Check month: 2016-11-01, never used to fit, calibrate or test. Its unexplained
# 7-day churn rate is examined there before 7-day test metrics are trusted.
check_month: 2016-11-01

# Which months each kind of choice may use.
choices:
  shared_across_horizons:  # feature set, imputation and encoding, survival family
    folds: [f7a, f7b, f30]
  classifier_hyperparameters:
    7: [f7a, f7b]
    30: [f30]
    59: [f30]
  calibration_method:
    per_horizon: {7: f7b_cal, 30: none, 59: none}  # see calibration_method below
  # Never decided by the folds: this protocol, the success criteria, the label
  # family, the population, and anything from the single-feature leak screen.

# Test pipeline: one model per family, fit and calibrated with labels as of
# 2017-01-01, scored once on the test months with labels as of 2017-03-31.
test:
  fit_as_of: 2017-01-01
  fit: [2016-08-01, 2016-09-01]
  calibration: {snapshot: 2016-10-01, half: calibration}
  label_as_of: 2017-03-31
  months:
    7: [2017-01-01, 2017-02-01]  # the two months are the finding; pooled is a summary
    30: [2017-01-01]  # the whole 30-day test rests on this one month
  demonstration:
    # One test month, scored at 59 days (the 60-day window ends one day past the
    # last labelable expiry). Models are fit on two months (2016-08-01 and
    # 2016-09-01, both followed for the full 90 days at as_of 2017-01-01) and
    # calibrated on the calibration half of 2016-10-01 (its 60-day labels are
    # fully observed at that date). Reported in its own section, outside the
    # headline table.
    # One target in every family, for training, calibration and scoring:
    # lapse by day 59 (event_observed and days_to_event <= 59), because day 59
    # is the last day observable in 2017-01. Training on day 60 and scoring at
    # day 59 would mislabel the fit-month lapses that fall exactly on day 60:
    # 258 of 22,009 lapses by day 60 (142 in 2016-08, 116 in 2016-09). The
    # section is titled "59-day demonstration".
    59: {month: 2017-01-01, target_days: 59}
  sensitivity:
    - survival model also fit on 2016-11-01 (partly observed at 2017-01-01)
    - 7-day results without 2017-01-01 and without 2017-02-01
    - with and without discount100_only customers; results by segment
    - feature-group ablations (profile group; segment and paid_state; 365-day counts)
    - profile group added (never selectable; members_v3 is a snapshot taken after the data ends)

# Customers in a test month with no row of any segment in the fit or
# calibration snapshots. Only for comparing models with each other, always with
# its own interval. A number is shown only with at least min_events events and
# min_non_events non-events in that horizon and month; this floor is a choice
# for showing a number, not a claim that the subset is large enough (100 events
# still gives a wide AUC interval). Below it the cell reads "not interpretable".
never_seen:
  reference_snapshots: [2016-08-01, 2016-09-01, 2016-10-01]
  min_events: 100
  min_non_events: 100

# Baselines. The two simple rules were chosen after the single-feature leak
# screen. Auto-renew off was strong there (AUC 0.711 for 30-day churn when
# inverted). Fewer days to expiry was not (0.483 at 30 days); it is included
# because at 7 days only customers expiring within 7 days can lapse.
baselines:
  base_rate: {score: fit-month churn rate}
  auto_renew_off: {score: 1 - last_is_auto_renew}
  fewer_days_to_expiry: {score: -days_until_expiry}
  two_feature_logistic: {features: [days_until_expiry, last_is_auto_renew], fit: the fold or test pipeline fit rows}
  # days_until_expiry in bands 0-7, 8-14, 15-21, 22-29, 30+ (one-hot, 0-7 the
  # reference) plus last_is_auto_renew, so the 7-day step is not forced into a
  # straight line.
  banded_logistic: {features: [days_until_expiry_band, last_is_auto_renew], bands: [7, 14, 21, 29], fit: the fold or test pipeline fit rows}
# The strongest simple baseline at each horizon is the one with the highest
# fold-mean AUC on that horizon's folds (7: f7a, f7b; 30 and 59: f30), frozen
# before the test.

# LightGBM classifier: one model per horizon, target churned_h, trained on the
# P2 main rows of the test pipeline's fit months (primary). A second set is
# trained on the P1 main rows of the same fit months and scored on P1 main
# (secondary results only). Inputs: the primary feature groups; missing values
# handled natively; categorical columns as native categoricals with levels
# frozen from the fit months. No class weights, no early stopping, no row or
# column subsampling. deterministic: true, force_col_wise: true, num_threads: 4,
# seed: the global seed.
classifier:
  categorical: [last_payment_method_id, registered_via, segment, paid_state, last_row_kind]
  # 13 candidates. c00 is the library default (min_child_samples 20); it is not
  # one of the 12 grid points, which all use min_child_samples 200.
  # Columns: num_leaves, n_estimators, learning_rate, min_child_samples.
  candidates:
    c00: [31, 100, 0.1, 20]  # library default, the reference
    c01: [15, 100, 0.05, 200]
    c02: [15, 100, 0.1, 200]
    c03: [15, 300, 0.05, 200]
    c04: [15, 300, 0.1, 200]
    c05: [31, 100, 0.05, 200]
    c06: [31, 100, 0.1, 200]
    c07: [31, 300, 0.05, 200]
    c08: [31, 300, 0.1, 200]
    c09: [63, 100, 0.05, 200]
    c10: [63, 100, 0.1, 200]
    c11: [63, 300, 0.05, 200]
    c12: [63, 300, 0.1, 200]
  default: c00
  # Many candidates, so one can look better by chance. A tuned candidate
  # replaces the current pick only under the selection replacement rule below,
  # which includes a higher AUC on each 7-day fold separately (f7a and f7b). At
  # 30 and 59 days there is one fold (f30): a weaker guard, stated in the report.

# Reported for the chosen classifier and for every scored month.
classifier_reporting:
  - raw score distribution on each fold (mean and deciles) and the number of distinct score values
  - AUC gap to the strongest simple baseline at every horizon, with its paired interval
  - unseen category levels per categorical feature in every scored month (zero expected)

# Cox preprocessing, fitted on each fold's (or the test pipeline's) fit rows
# only and stored with the model: one missing flag per distinct null pattern
# (1 if any column of the pattern is null); median imputation; winsorising at
# the 0.5th and 99.5th percentiles; z-scaling of continuous columns (0/1 columns
# and flags unscaled); one-hot with levels of at least 100 fit rows, others
# "other", null "missing", unseen at scoring "other" (counted), most frequent
# level dropped as reference; exact copies or complements of an earlier column
# dropped and reported. One method, no alternatives: nothing to select.
cox_preprocessing:
  flag_per_null_pattern: true
  impute: median
  winsorize_quantiles: [0.005, 0.995]
  min_level_rows: 100
  # Constants (median, winsorising limits, mean, SD) logged per fold for these
  # columns and compared across folds (a column absent from a fold's feature
  # set is skipped).
  logged_columns: [secs_per_day_28, active_days_28, days_since_last_listen, ratio_secs_7_vs_base,
    slope_secs_4w, days_since_last_txn, last_amount_paid, n_txn_365, tenure_days, days_until_expiry]

# Cox subsample, only if one Cox fit on the largest fit set takes more than 10
# minutes or 4 GB peak RSS (measured in the first Cox step). Whole customers in
# sample buckets 0-9 (md5 bucket, independent of behaviour). If used, it is
# decided and stated before any result is read, and every model family
# (classifier and baselines included) trains on the same subsample from the
# start; scoring and evaluation always use all rows.
subsample:
  max_cox_fit_minutes: 10
  max_cox_fit_peak_gb: 4
  buckets: [0, 9]

# Data loading: model code reads only the snapshots and columns it needs, with
# parquet filters; a test checks that training and scoring never load all
# snapshots. Peak RSS is reported per stage; the limit is 6 GB on the 20%
# sample (stop and report if exceeded).
resources:
  max_peak_rss_gb: 6

# Bootstrap used for every interval: in each replicate, draw customers with
# replacement from the union of customers across the folds or months being
# combined; a drawn customer brings all their rows in every fold or month.
# Compute the statistic per fold or month, average across them, repeat.
# Percentile interval; the point estimate is the value on the original data.
bootstrap:
  replicates: 1000
  level: 0.95
  cluster: customer
interval_note: >-
  This interval covers which customers happened to be in that month, not
  month-to-month change.

# Survival models. All three families train on the same rows as the classifier:
# P2 main rows of 2016-08-01 and 2016-09-01, labels as of 2017-01-01, follow-up
# censored at min(T + 90, as_of - 30 = 2016-12-02); both months are followed for
# the full 90 days (2016-10-30 and 2016-11-30). 2016-10-01 would be censored at
# day 62 and is the calibration month, so it never trains. A secondary set is
# trained on P1 main rows of the same months and scored on P1 main.
survival:
  cox:
    # lifelines CoxPHFitter, Efron ties, ridge penalty; probability by Breslow
    # baseline: P(lapse by h) = 1 - S0(h) ** exp(b.x).
    # Stratified variant: one baseline per days_until_expiry band; P2 bands
    # 0-7, 8-14, 15-21, 22-29, P1 adds 30-59, 60-89, 90+. Within a stratum
    # days_until_expiry is omitted (the band baseline carries the timing; the
    # variation inside a band is lost, not counted twice). Every Cox variant
    # omits days_until_paid_expiry. On the fit rows its difference from
    # days_until_expiry is never positive, null for the 1,219 never-paid rows,
    # 0 for 298,661 rows, and nonzero for 3,192 rows, all of them in segment
    # paid; 3,188 of those have a promo, trial or 100%-discount last row, and
    # every such row with a paid expiry is nonzero. So it is not a proxy for
    # segment, but it is nearly a proxy for last_row_kind (already an input),
    # and the raw column would bring the expiry date back in through a
    # near-copy. Tree models keep the raw column.
    # Proportional-hazards test (scaled Schoenfeld residuals) reported per
    # feature and summarised per feature group; at this sample size almost every
    # test rejects, so the size of the statistic is read, not the p-value.
    candidates:  # [stratified, penalizer]
      cox01: [false, 0.1]
      cox02: [false, 0.01]
      cox03: [true, 0.1]
      cox04: [true, 0.01]
  xgboost_aft:
    # objective survival:aft; P(lapse by h) = F((log h - f(x)) / sigma).
    # Time counted from day 1 (a lapse on day 0 is at time 1); censored rows
    # have an open upper bound. max_depth 6, eta 0.05, 300 rounds, hist trees,
    # native missing values and categoricals, nthread 4, global seed.
    candidates:  # [distribution, sigma]
      aft01: [normal, 1.0]
      aft02: [normal, 0.5]
      aft03: [normal, 2.0]
      aft04: [logistic, 1.0]
      aft05: [logistic, 0.5]
      aft06: [logistic, 2.0]
  discrete_time:
    # LightGBM on one row per customer and interval at risk; S(h) is the
    # product of (1 - hazard) over intervals up to h. Hyperparameters are those
    # selected for the 7-day classifier (no separate tuning).
    # Ends at 59, not 60, so the 59-day target is an interval end.
    interval_ends: [7, 14, 21, 30, 37, 44, 51, 59, 67, 74, 81, 90]
    # The interval end day is the time variable. "interval end minus
    # days_until_expiry" is a deliberate engineering input: it tells the model
    # where the current expiry falls relative to the interval. The classifier
    # also sees days_until_expiry, but this input makes the model less pure
    # survival modelling; said in the report.
    candidates:
      dt01: {expiry_offset_input: false}
      dt02: {expiry_offset_input: true}

# Pre-registered expectations, repeated in the report beside the results:
# Cox and XGBoost AFT will probably lose to the 7-day classifier on P2, because
# days_until_expiry moves risk to a specific day, which proportional hazards and
# a single-peaked time distribution cannot express. The discrete-time model will
# probably tie the 7-day classifier, because its first interval is a 7-day
# classifier on the same rows. At 30 days on P2 every current expiry falls inside
# the window, so survival has no structural edge there. If survival adds
# something it is most likely at 59 days, on P1, and in the shape over days.
expectations:
  cox_and_aft_at_7_days: likely loss
  discrete_time_at_7_days: likely tie
  any_survival_at_30_days: no structural edge

# Choosing between candidates on the folds.
selection:
  metric: AUC of churn within h days on P2 main (survival models score 1 - S(h))
  score: mean over the slot's folds; the gap between folds is reported
  # Stages, each frozen before the next:
  #   1. Feature set, with classifier c00, on f7a, f7b, f30; shared by every
  #      model so survival and classifier differ only in the model.
  #   2. Classifier hyperparameters per horizon (7: f7a, f7b; 30 and 59: f30).
  #   3. Survival: the best candidate within each family on f7a, f7b, f30, then
  #      the family.
  #   4. Calibration method on f7b_cal (see calibration_method below).
  stages: [feature_set, classifier_hyperparameters, survival_candidate, survival_family, calibration_method]
  feature_sets:  # simplest first; the profile group is never selectable
    fs1: {drop: [counts_365]}  # 5 groups, 40 columns
    fs2: {drop: [segment_state]}  # 5 groups, 44 columns
    fs3: {drop: []}  # 6 groups, 46 columns (the Phase 2 primary set)
  # One total order for "simpler", compared axis by axis; the first axis on
  # which two candidates differ decides, later axes are not consulted:
  #   1. family: cox < xgboost_aft < discrete_time
  #   2. fewer feature groups, then fewer columns
  #   3. library default over tuned hyperparameters
  #   4. Platt over isotonic
  #   5. candidate id order within a family (ids are listed simplest first)
  # So a simpler family with more feature groups is simpler than a complex
  # family with fewer. In practice the feature set is chosen once and shared,
  # so axes 1 and 2 never conflict.
  simplicity_order: [family, feature_groups, columns, default_over_tuned, platt_over_isotonic, candidate_id]
  # Ladder: sort a slot's candidates by the order above. The current pick
  # starts as the simplest. Walk the list; a candidate replaces the current
  # pick only if BOTH hold:
  #   (a) the 95% bootstrap interval of the fold-mean AUC difference
  #       (candidate - current pick) lies above 0;
  #   (b) its AUC is higher than the current pick's on every fold of the slot.
  # Otherwise the current pick stays. The last current pick is chosen.
  replacement_rule: [fold_mean_interval_above_zero, higher_on_every_fold]

# Calibration of probabilities. One calibrator per model and horizon (7, 30,
# 59), fitted on the calibration half of 2016-10-01 against churned_7,
# churned_30 and lapse by day 59 (P1 models on its P1 main rows). Survival
# models are calibrated at those three horizons only; the curve between them
# stays uncalibrated (the integrated Brier score and the shape checks use the
# uncalibrated curve, and any later day-by-day bucket must say so).
# Order of operations for every customer:
#   1. apply the horizon's calibrator to the raw probability;
#   2. clip to [1e-6, 1 - 1e-6];
#   3. ordering fix: pool adjacent violators over (p7, p30, p59) with equal
#      weights, so p7 <= p30 <= p59 (a violating pair becomes its average);
#   4. clip again to [1e-6, 1 - 1e-6];
#   5. slope and intercept are computed on the result (the final probabilities).
# Discrimination verdicts use the raw scores. The final probabilities are not
# rank-identical to the raw scores (isotonic steps and the ordering fix create
# ties), so the AUC of raw and of final scores is reported for every model.
# Reported for every calibrated output: number of distinct values; customers
# changed by the ordering fix (count, share, mean and max change); slope and
# intercept before and after the fix; a flag when the fix changes more than 1%
# of customers in a cell (descriptive).
calibration_steps: [calibrate, clip, order_fix, clip, evaluate]
order_fix: {method: pool_adjacent_violators, weights: equal, horizons: [7, 30, 59], flag_share: 0.01}

# Calibration method (stage 4). Fit Platt and isotonic on 2016-09-01, score
# 2016-11-01 (f7b_cal, 7 days). AUC barely changes under calibration, so the
# metric is the Brier score: isotonic replaces Platt only if the 95% paired
# interval of the Brier difference (isotonic - Platt) lies below 0.
# Calibration method per horizon. Isotonic is eligible at a horizon only if
# BOTH hold: (a) it beats Platt on that horizon's own calibration fold (Brier,
# paired interval of isotonic - Platt below 0), and (b) the test pipeline's
# calibration slice has at least isotonic_min_events events at that horizon.
# A fold decides nothing at any other horizon. Otherwise the method is Platt.
#   7 days: the fold is f7b_cal (fit 2016-08, calibrate 2016-09 with 2,338
#     lapses, score 2016-11). The test calibration half has 976 lapses by day 7,
#     below 1,000, so (b) fails: Platt at 7 days whatever f7b_cal shows.
#   30 days: no fold has a calibration slice. f30 is fit on 2016-08 and scores
#     2016-10 at as_of 2016-10-01; the only other usable snapshot, 2016-09, is
#     not fully observed for 30 days until 2016-10-31. So (a) cannot be tested:
#     Platt at 30 days.
#   59 days: no fold: Platt.
# Result of these rules on the counts above: Platt at every horizon on test.
# f7b_cal still compares Platt and isotonic at 7 days, reported as descriptive
# evidence only.
calibration_method:
  candidates: [platt, isotonic]
  metric: brier
  replace_if: interval_below_zero
  isotonic_min_events: 1000
  fold_per_horizon: {7: f7b_cal, 30: null, 59: null}
  method_on_test: {7: platt, 30: platt, 59: platt}

# Success criteria on the test months.
discrimination:
  metric: AUC of churn within h days on P2 main
  comparators: [lightgbm_classifier, strongest_simple_baseline]
  min_difference: 0.01  # threshold of practical relevance
  report_thresholds: [0.005, 0.02]  # verdicts shown for these too; the 0.01 verdict stands
  # d = AUC(survival) - AUC(comparator), paired 95% interval [lo, hi]:
  verdicts:
    win: "lo > 0 and d >= 0.01: survival beats X at h days in month M"
    below_threshold: "lo > 0 and d < 0.01: better by less than the 0.01 minimum; not a win"
    no_difference: "lo <= 0 <= hi: no difference shown"
    loss: "hi < 0: survival is worse than X"
  # At 7 days a cell wins only if both test months win; a win in one month and
  # anything else in the other is "mixed: not shown at 7 days".
  # The phase goal "survival beats the baseline on the test snapshot" is met only
  # if survival wins against both comparators in all three cells: 30 days
  # 2017-01, 7 days 2017-01, 7 days 2017-02. Not meeting it is a legitimate
  # outcome: the report states the result and the cells that failed.
  # No multiple-comparison correction; requiring every cell is the safeguard.

calibration:
  # On calibrated probabilities at horizon h, per test month, P2 main.
  # Pass/fail on slope and intercept (point estimates; intervals from the same
  # customer bootstrap, "borderline" when an interval crosses a limit).
  slope: [0.8, 1.2]  # logistic regression of outcome on logit(p)
  intercept: [-0.2, 0.2]  # same regression with slope fixed at 1 (log-odds)
  # Descriptive only: 10 equal-count bins of p, size-weighted mean of
  # |mean p - event rate|, shown with its bootstrap interval and as a share of
  # the event rate. Not interpretable when the interval reaches below 0.5x or
  # above 1.5x its value.
  ece: {bins: 10, binning: equal_count, criterion: false, reference_share: 0.2}
  # The phase goal "calibration near the diagonal" is met only if the survival
  # model passes in all three cells. A method that fails at a horizon is not
  # switched on test data; that horizon's probabilities are labelled
  # uncalibrated. Correction: an earlier version said the method must also
  # pass on f30 at 30 days. f30 has no calibration slice (see
  # calibration_method), so no calibrated 30-day probability exists on any
  # fold; f30 reports the calibration of the raw 30-day probabilities,
  # descriptive only. The 30-day criterion is judged on test only. Calibration
  # is reported in the 59-day demonstration.
  #
  # Stated before scoring: the logged 7-day P2 rates are 1.32% in 2016-10 (the
  # calibration month) and 1.78% in 2017-01. If the features do not explain the
  # January rise, a model calibrated on October has an intercept of about
  # logit(0.0178) - logit(0.0132) = -4.0106 - (-4.3143) = +0.30 at 7 days in
  # 2017-01, outside the limit. The limits above were not set around this.

# Metrics with censoring. Every evaluated month has one common stop day C, so
# the censoring curve G(t) is 1 for t <= C and every inverse-probability-of-
# censoring weight is exactly 1; one weighted Brier function is used anyway and
# raises beyond C. Integrated Brier score (survival models only):
#   primary: the discrete-time interval ends up to the month's C, the same days
#     for every model (2017-01: 7, 14, 21, 30, 37, 44, 51, 59; 2017-02: 7, 14,
#     21; folds: 7, 14, 21, 30);
#   secondary: every day 1..C, the discrete-time curve interpolated linearly
#     between interval ends.
# Skill = 1 - IBS(model) / IBS(reference), over two references fitted on the fit
# rows: a feature-free Kaplan-Meier curve, and Kaplan-Meier curves stratified
# by days_until_expiry band (0-7, 8-14, 15-21, 22-29, 30+).
# Calibration regressions clip probabilities to [1e-6, 1 - 1e-6] before the
# logit; the number clipped is reported per model and month.
# Concordance is cut at C, so it is not comparable across months; PR AUC
# depends on the event rate, so it is compared only within a month. Both notes
# are printed beside every table that shows them.
metrics:
  ibs_primary_grid: discrete_time_interval_ends_up_to_C
  ibs_secondary_grid: every_day_up_to_C
  km_references: [overall, days_until_expiry_band]
  km_bands: [7, 14, 21, 29]
  logit_clip: 1.0e-6

# Shape-over-days checks: descriptive, feed no win condition.
shape_checks:
  - lapses in days 8-30 predicted as the sum of S(7) - S(30) against observed,
    using the same labels the 30-day classifier is scored on
  - share of test customers whose separate 7, 30 and 59-day classifiers give
    crossing probabilities (describes three independent classifiers, not a
    property of any one model)

# Experiment tracking: MLflow with a SQLite file and an artifact folder under
# mlruns/ (git-ignored). Every run is tagged with its kind; fold, check-month,
# sensitivity and the one test run are never mixed. If the SQLite backend
# fails, the fallback is a folder store under mlruns/ (fallback_uri); nothing
# else changes, and every run carries the tag tracking_backend (sqlite or
# folder). Tags and parameters hold paths relative to the repository root,
# never absolute paths (a test scans a run's tags and parameters for
# "/Users/" and for the home directory). reports/model_comparison.md is
# generated from the numbers logged in MLflow by the report command, never
# copied by hand from run files.
tracking:
  uri: sqlite:///mlruns/mlflow.db
  fallback_uri: mlruns/folder_store
  backend_tag: tracking_backend
  forbidden_in_tags: ["/Users/", "home_directory"]
  artifact_root: mlruns/artifacts
  experiment: kkbox_churn_models
  run_kinds: [label_check, fold, calibration_fold, check_month, freeze, test, sensitivity]
  # Run name: <kind>-<fold or month>-<family>-<candidate>-h<horizon>-<feature set>.
  # Logged on every run: parameters (family, candidate and its hyperparameters,
  # horizon, feature set and its groups, population, segments, label family,
  # fit/calibration/scored snapshots and halves, as_of per role, seed,
  # subsample yes/no); metrics with their interval bounds and event counts;
  # tags: git commit and dirty flag, SHA-256 of this file, the
  # pre-registration commit, SHA-256 of labels.parquet and features.parquet,
  # package versions (python, numpy, pandas, scikit-learn, lightgbm, xgboost,
  # lifelines, mlflow), runtime in seconds and peak RSS in GB.
  logged_package_versions: [python, numpy, pandas, pyarrow, scikit-learn, lightgbm, xgboost, lifelines, mlflow]

# Frozen choices and the test guard. After the fold stages, the chosen feature
# set, candidates, family and calibration method are written to
# configs/choices.yaml together with the pre-registration commits, the SHA-256
# of this file and the MLflow run ids behind each choice, and committed on
# their own. The pre-registration commits are every commit that changed this
# file: 8b6562c, 4369ab0 and the commit that adds this paragraph. The binding
# one is the last of them; a commit cannot name its own hash, so choices.yaml
# records it. The test run refuses to start unless all of these hold:
#   1. the tracked files are unchanged against HEAD (clean working tree);
#   2. the binding pre-registration commit is an ancestor of HEAD; the blob of
#      configs/evaluation.yaml at that commit has the SHA-256 recorded in
#      choices.yaml; the working-tree file has the same SHA-256; and no commit
#      after it changed this file (a hash match on the working tree alone is
#      not enough);
#   3. choices.yaml is committed, says frozen: true and fills every stage;
#   4. every run id it cites exists and carries the same config hash;
#   5. no finished test run exists (the test is scored once; a run that
#      crashed may be repeated, with the earlier run id and the reason logged).
# Outcome columns of snapshots on or after 2017-01-01 are read only through
# the guarded test entry point; any other read raises (unit-tested).
test_guard:
  choices_file: configs/choices.yaml
  locked_outcomes_from: 2017-01-01
