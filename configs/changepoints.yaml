# Churn change points and the daily batch-size indicator.
# Committed alone, before any real series is analysed and before the known
# gap days are scored. A change after a result is seen is a logged amendment,
# and the original result is reported alongside.
# The detector section was added in a second commit, still before the
# synthetic study ran and before any real series was analysed.

series:
  unit: expiry_event  # customers with an effective expiry in the week (snapshot rows with in_expiry_month); amended, see the amendment note below
  week_start: monday  # ISO week of the effective expiry
  churn_rule: gap_to_next_subscription_days > 30  # inclusive 30-day rule
  headline: paid  # excludes discount100_only
  separate_series: [discount100_only, trial_only, promo_only]  # never pooled
  min_events_per_cell: 1838
  min_events_reason: smallest n at which a rate near 5 percent has a Wilson 95 percent interval narrower than +/-1 point
  thin_cells: [month, whole_period]  # roll-up order; never in a detection run
  grain_rule:  # decided from event counts only, before the paid weekly count
    evaluated_on: [2016-02-15, 2016-12-31]
    use_two_week_bins_if_share_of_weeks_below_min_exceeds: 0.5
    use_month_bins_if_share_of_two_week_bins_below_min_exceeds: 0.5
  complete_week_rule: week_end_plus_30_days_on_or_before_data_end
  data_end: 2017-03-31
  series_end: 2016-12-31  # snapshots before 2017-01-01 only; no read path for 2017 outcomes
  primary_start: 2016-02-15  # earlier weeks carry left_truncation_risk
  exploratory_before_primary: true  # 2015 weeks are a labelled exploratory series
  known_level_shifts: [2016-09, promotion_waves_late_2015, 2016-11]  # annotated, not removed

daily_indicator:
  rows: non_cancel_auto_renew  # payment rows per transaction date
  first_month_with_baseline: 2015-04
  day_classes:
    calendar_days: [2, 27]  # same calendar day; day 1 is not judged on its own
    month_end_block_days: 4  # last four days, judged as one block by position from the end
  baseline: median_of_same_class_over_preceding_3_months
  gap_below_ratio: 0.60  # kept from the monthly batch check
  weekday_rule:
    evaluated_on: clean_months_days_2_to_27_only
    use_same_weekday_baseline_if: abs(same_weekday_median_ratio - 1) > 1.4826 * MAD_of_daily_ratio
  clean_months: [2016-03, 2016-04, 2016-05, 2016-06, 2016-07, 2016-08, 2016-09, 2016-10, 2016-11]
  max_false_flags_in_clean_months: 1  # days or blocks; if exceeded, reported as failed, no tuning
  known_gap_days: [2016-12-05, 2017-02-13]
  known_non_gap_days: [2016-12-30]  # batch moved to the 31st
  not_looked_at_before_commit: [2016-12, 2017-02]
  pass_marks:
    flags_known_gap_days: true
    does_not_flag_moved_batch_day: true
    batch_move_test_passes: true
    false_flags_within_limit: true
  week_flag:  # a week is flagged renewal_gap if a gap day falls in this window
    from: week_start
    to: week_end_plus_30_days
  limits:
    - a shortfall inside a month-end block offset by an overflow in the same block is not flagged
    - the weekday rule can miss a small real effect

detector:
  method: ruptures_pelt
  cost: l2  # mean shift
  min_size_weeks: 3
  jump: 1
  penalty: c * sigma2 * log(T)  # sigma2: binomial variance of a weekly rate at the week's event count and the pooled rate; T: number of points
  c_grid: [1, 2, 3, 5]
  c_selection: smallest c in the grid that meets every pass mark, judged at 1.5 times the binomial noise, at all three base rates; if none does, the study is reported as not met and c = 5 is used, alerts labelled unvalidated
  tolerance_weeks: 1  # the grain is weekly, so the tolerance is +/-1 week; this replaces "a few days" in the plan
  study:
    seed: 20161101
    replicates_per_cell: 500
    series_length_weeks: 40
    base_rates: [0.05, 0.10, 0.20]  # a grid, so the real rate level is not needed
    noise: binomial at the real weekly event counts (counts only, no rates read from the real series)
    shift_sizes_points: [1, 2, 3, 5]
    two_shift_series: true  # two shifts in one series, to check segments are not merged
    stable_stretches: true
  pass_marks_noise_multiplier: 1.5  # with about 36,000 paid events per week, binomial noise is very small; the marks are judged at 1.5x, which decides the power-table row for the real series
  pass_marks:  # judged on the c_selection rule above, at the multiplier above
    detect_3_points_within_tolerance: 0.80  # share of replicates
    detect_5_points_within_tolerance: 0.90
    stable_mean_false_alarms_per_stretch_at_most: 0.5
    stable_share_of_stretches_with_any_false_alarm_at_most: 0.10
  reported_points:  # reported, not pass marks
    - power curve for shifts of 1 and 2 points
    - results at 1.0 times (pure binomial) and at 2 times the binomial noise, and the shift size and base rate where the detector breaks
    - distribution of false-alarm counts per stable stretch (0, 1, 2 or more), not only the mean
    - the first and last weeks where a change cannot be seen (minimum segment length)
    - spike scenario: on the same base noise, a spike of 3 and of 4 times the base rate lasting 1 week and one lasting 4 weeks (like the late-February to March 2016 excursion and the 2016-12-05 week); report how many change points are returned and whether they sit at both edges of the spike or are absent, with the registered minimum segment of 3
  spike_alert_rule: an alert around such a spike is reported with the renewal_gap or unreliable-month flag and never as a churn shift
  study_details:
    series_counts: 40 consecutive real weekly paid event counts from 2016-02-15 to 2016-12-19, window start drawn at random from the first 6 positions (counts only)
    noise_model: weekly rate = base rate + multiplier * binomial standard error at that week's count * standard normal
    shifts: upward only, at a random week with at least 8 weeks before and after; sizes in absolute points of rate
    detector_sigma2: binomial variance at the series' own mean rate and the week's count (not inflated by the multiplier)
    detected_if: a returned change point within +/-1 week of the true shift week
    false_alarm_count: change points returned on a stable series
    two_shift_series: shifts of 3 points at weeks 8 to 16 and 24 to 32, both must be detected within tolerance
  real_series_mapping: the row of the power table used for the real paid series is the grid base rate nearest the real pooled paid rate, decided after the study and stated in the doc
  never: tune the penalty, the minimum segment or any mark on a real series
  if_marks_fail: report not met with the power curve; no re-tuning; real alerts labelled unvalidated at that sensitivity

month_end_check:  # before any detector run on real data; 2016 outcomes only (snapshots before 2017-01-01)
  series: paid weekly churn rate (churned_classic), weeks starting 2016-02-15 to 2016-12-19
  classes: month_end_week (a Monday-Sunday week that contains one of the last four calendar days of a month) versus other_week
  test: difference in mean weekly rate between the classes, with its Welch t statistic
  pattern_present_if: absolute Welch t at least 3 AND absolute difference larger than the week-to-week standard deviation of the weekly rate among other_week weeks
  if_present:
    each_class_has_at_least_4_weeks: subtract the class median of the weekly rate (computed on the same weeks, before the detector runs)
    otherwise: use month-end-matched weeks only
  if_absent: detection runs on the unadjusted series
  minimum_segment_weeks: 3
  reported: weekly rate table, both class means, the difference, the t value, the standard deviation, the choice made, and the number of weeks with unobserved rows
  limit: the test is weak at about 45 weeks; "absent" means not detected, not shown to be absent
  segment_note: the segment on the first of the month is used for the whole month's expiries

amendment_2026_10_15:
  what: the series unit was first written as `spell_end` (one event per spell end)
  why: factual specification error. A spell is continuous coverage and a seamless renewal does not end one, so spell ends are not customers with an expiry in the week. Found when the paid weekly count was made. Not tuned on any result.
  changed: unit now expiry_event; marks judged at 1.5x noise; month_end_check added; min_events_per_cell and the grain rule are unchanged

amendment_2_2026_10_15:
  what: month_end_check classes, threshold and response made explicit (month-end week = contains one of the last four days; second condition on the standard deviation; response by class size)
  why: registered before any 2016 outcome was read; replaces the first wording of month_end_check (kept in the log)

alerts:  # registered before the detector reads any real series
  status: exploratory, validated at 1.5x binomial noise; c = 5 is the last grid value and has no headroom
  study_record:
    - the study validates the detector's mechanics, not its false-alarm rate on the real series
    - real quiet-week variation is about 0.4 to 0.55 points, roughly four to five times the binomial noise (descriptive, weeks chosen by eye)
    - both-edges tally caveat: one change point within tolerance of both edges of a 1-week spike counts as both; the minimum segment of 3 forces a 3-week segment, so two change points sit one week either side
    - no tuning on real data
  windows:
    follow_detector_segments: true  # week = first week of the segment the change point starts; before and after windows are the segments either side, at most 8 weeks each, never crossing a neighbouring change point
    max_weeks_each_side: 8
  size_small_points: 1.0  # |after - before| below this is "detected, small"; relation to the quiet-week standard deviation is reported after the run
  quiet_week_sd:
    rule: pooled within-segment standard deviation of the weekly rate (deviation from the segment's own mean), over weeks that are not flagged (renewal_gap, unreliable_month, uncertain_month) and that sit in detector segments of at least 8 weeks
    reported: the value, the number of weeks, and the threshold in standard errors of a difference of two 3-week means
  returned_to_level:
    band: before-window mean +/- 2 quiet-week standard deviations
    true_if: the mean of the segment after the one the change point starts lies in the band
    null_if: there is no later segment
  flags:
    window_weeks: [-1, 0, 1]  # weeks around the change point
    renewal_gap: a gap date of the daily indicator lies from a window week's start to its end plus 30 days
    unreliable_month: a window week's Monday or Sunday falls in a month the month-quality screen marks unreliable
    uncertain_month: the same for uncertain
    left_truncation_risk: a window week starts before 2016-02-15
    known_period:
      - {label: the September 2016 level shift, from: 2016-09-01, to: 2016-09-30}
      - {label: the November 2016 promotion wave, from: 2016-11-01, to: 2016-11-30}
  priority: [renewal_gap, unreliable_month, left_truncation_risk, known_period, small, normal]
  uncertain_month_suffix: appended to any template when an uncertain or unreliable month is flagged but is not the primary
  drill_down:
    series: paid only
    dimensions:
      plan_length: {column: last_plan_days, buckets: [missing, "0-7", "8-30", "31-99", "100+"]}
      payment_method: {column: last_payment_method_id}
      auto_renew: {column: last_is_auto_renew}
      city: {column: city}
      registration_channel: {column: registered_via, note: descriptive segment only, never a lever}
      tenure: {column: tenure_days, buckets: [missing, "0-89", "90-364", "365-729", "730+"]}
    never_used: [age, gender, profile_group, archetypes]
    segment_source: features at the snapshot's first day
    min_events_each_period: 1838
    top_segments: 3  # by absolute rate contribution, over all dimensions
    rate_contribution: (rate_after - rate_before) * (share_before + share_after) / 2
    mix_contribution: (share_after - share_before) * (rate_before + rate_after) / 2
    additive_within_dimension_only: true
  sentence:
    forbidden_causal: [causes, caused, because, due to, leads to, drives, results in]
    forbidden_advice: [should, turn on, switch, increase, improve, reduce, try, consider]
    forbidden_lever: [target, focus on, address, fix, act]
    forbidden_phrases: [churn shift, churn worsen]
    digits_only_in_fact_fields: true
    templates:
      renewal_gap: "This change coincides with a data gap on {dates}; the weekly churn rate for {series} moved from {before} to {after} from the week of {week}; it is flagged for data quality and not reported as a change in customer behaviour{returned}{also}."
      unreliable_month: "This change falls in {month}, a month the data-quality screen marks as {status}; the weekly churn rate for {series} moved from {before} to {after} from the week of {week}; it is flagged for data quality and not reported as a change in customer behaviour{returned}{also}."
      left_truncation_risk: "This change falls in a period where the data may cut observation windows short; the weekly churn rate for {series} moved from {before} to {after} from the week of {week}{returned}{also}."
      renewal_window: "This change from the week of {week} falls in the {window_days}-day renewal window of a data gap on {dates}; the weekly churn rate for {series} moved from {before} to {after}; it is flagged for data quality and not reported as a change in customer behaviour{returned}{also}."
      short_window: "A change point was detected from the week of {week}; a window on one side had too few weeks, so no rates are stated{also}."
      known_period: "This change coincides with a period marked {label} in the data notes; the weekly churn rate for {series} moved from {before} to {after} from the week of {week}{segments}{returned}{also}."
      small: "A small change was detected: the weekly churn rate for {series} moved from {before} to {after} from the week of {week}; no segments are ranked{returned}{also}."
      normal: "The weekly churn rate for {series} {moved} from {before} to {after} from the week of {week}{segments}{returned}{also}."
    pieces:
      segments: "; the largest rate changes are in {list}"
      segments_none: "; no segment met the minimum size"
      returned: "; the weekly rate was back within its earlier range by the week of {return_week}"
      also: "; also in {month}, marked {status}"
    fewer_than_three: list the ranked segments; if none, use segments_none
    template_fix_2026_10_15: renewal_window (a gap date only in the 30-day renewal window of a window week) and short_window (an empty or short window) added; renewal_gap keeps the same-week wording
