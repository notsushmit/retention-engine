# Churn change points and the daily batch-size indicator.
# Committed alone, before any real series is analysed and before the known
# gap days are scored. A change after a result is seen is a logged amendment,
# and the original result is reported alongside.
# The detector section was added in a second commit, still before the
# synthetic study ran and before any real series was analysed.

series:
  unit: spell_end  # one event per spell end
  week_start: monday  # ISO week of the effective expiry
  churn_rule: gap_to_next_subscription_days > 30  # inclusive 30-day rule
  headline: paid  # excludes discount100_only
  separate_series: [discount100_only, trial_only, promo_only]  # never pooled
  min_events_per_cell: 1838
  min_events_reason: smallest n at which a rate near 5 percent has a Wilson 95 percent interval narrower than +/-1 point
  thin_cells: [month, whole_period]  # roll-up order; never in a detection run
  grain_rule:  # decided from event counts only, before the paid weekly count
    evaluated_on: [2016-02-15, 2016-12-31]
    use_two_week_bins_if_share_of_weeks_below_min_exceeds: 0.5
    use_month_bins_if_share_of_two_week_bins_below_min_exceeds: 0.5
  complete_week_rule: week_end_plus_30_days_on_or_before_data_end
  data_end: 2017-03-31
  series_end: 2016-12-31  # snapshots before 2017-01-01 only; no read path for 2017 outcomes
  primary_start: 2016-02-15  # earlier weeks carry left_truncation_risk
  exploratory_before_primary: true  # 2015 weeks are a labelled exploratory series
  known_level_shifts: [2016-09, promotion_waves_late_2015, 2016-11]  # annotated, not removed

daily_indicator:
  rows: non_cancel_auto_renew  # payment rows per transaction date
  first_month_with_baseline: 2015-04
  day_classes:
    calendar_days: [2, 27]  # same calendar day; day 1 is not judged on its own
    month_end_block_days: 4  # last four days, judged as one block by position from the end
  baseline: median_of_same_class_over_preceding_3_months
  gap_below_ratio: 0.60  # kept from the monthly batch check
  weekday_rule:
    evaluated_on: clean_months_days_2_to_27_only
    use_same_weekday_baseline_if: abs(same_weekday_median_ratio - 1) > 1.4826 * MAD_of_daily_ratio
  clean_months: [2016-03, 2016-04, 2016-05, 2016-06, 2016-07, 2016-08, 2016-09, 2016-10, 2016-11]
  max_false_flags_in_clean_months: 1  # days or blocks; if exceeded, reported as failed, no tuning
  known_gap_days: [2016-12-05, 2017-02-13]
  known_non_gap_days: [2016-12-30]  # batch moved to the 31st
  not_looked_at_before_commit: [2016-12, 2017-02]
  pass_marks:
    flags_known_gap_days: true
    does_not_flag_moved_batch_day: true
    batch_move_test_passes: true
    false_flags_within_limit: true
  week_flag:  # a week is flagged renewal_gap if a gap day falls in this window
    from: week_start
    to: week_end_plus_30_days
  limits:
    - a shortfall inside a month-end block offset by an overflow in the same block is not flagged
    - the weekday rule can miss a small real effect

detector:
  method: ruptures_pelt
  cost: l2  # mean shift
  min_size_weeks: 3
  jump: 1
  penalty: c * sigma2 * log(T)  # sigma2: binomial variance of a weekly rate at the week's event count and the pooled rate; T: number of points
  c_grid: [1, 2, 3, 5]
  c_selection: smallest c in the grid that meets every pass mark at all three base rates; if none does, the study is reported as not met and c = 5 is used, alerts labelled unvalidated
  tolerance_weeks: 1  # the grain is weekly, so the tolerance is +/-1 week; this replaces "a few days" in the plan
  study:
    seed: 20161101
    replicates_per_cell: 500
    series_length_weeks: 40
    base_rates: [0.05, 0.10, 0.20]  # a grid, so the real rate level is not needed
    noise: binomial at the real weekly event counts (counts only, no rates read from the real series)
    shift_sizes_points: [1, 2, 3, 5]
    two_shift_series: true  # two shifts in one series, to check segments are not merged
    stable_stretches: true
  pass_marks:  # judged on the c_selection rule above
    detect_3_points_within_tolerance: 0.80  # share of replicates
    detect_5_points_within_tolerance: 0.90
    stable_mean_false_alarms_per_stretch_at_most: 0.5
    stable_share_of_stretches_with_any_false_alarm_at_most: 0.10
  reported_points:  # reported, not pass marks
    - power curve for shifts of 1 and 2 points
    - result at 2 times the binomial noise, and the shift size and base rate where the detector breaks
    - distribution of false-alarm counts per stable stretch (0, 1, 2 or more), not only the mean
    - the first and last weeks where a change cannot be seen (minimum segment length)
  real_series_mapping: the row of the power table used for the real paid series is the grid base rate nearest the real pooled paid rate, decided after the study and stated in the doc
  never: tune the penalty, the minimum segment or any mark on a real series
  if_marks_fail: report not met with the power curve; no re-tuning; real alerts labelled unvalidated at that sensitivity
