# Phase 7: actions and their assumed effects, registered before any optimizer run.
# Committed alone. The level names "off" and "on" are quoted: bare, YAML reads them as booleans.
# Value, costs, lead times, budget levels and the dt01 refit were added in the
# second commit, before any of them was run or used.
# The optimizer, the comparison strategies and the observed-churn check were
# added in the third commit, before any of them was run or read.
# The sensitivity analysis, the stability rules and the pass marks were added in
# the fourth commit, before any run.
# The wording rules, the fixed disclaimers and the run-time stop were added in the
# fifth commit, before any code.
# The exact check's time limit and its rules for an unproven solve were added in
# the sixth commit, before any real step.
#
# Every effect below is an ASSUMPTION chosen by the user. None is an estimate: no
# KKBox uplift estimate exists for any action, and no number here comes from KKBox
# outcomes or from any other dataset. No value in this file is tuned after any
# optimizer run is seen. A later change is a logged amendment, and the results under
# the original values are reported alongside.

label: "assumed effect: user choice, 2026-10-17, provisional, not estimates"
effect_basis: assumed  # carried as a column and as Parquet metadata on every output
source: user choice, 2026-10-17, provisional, not estimates
tuned_after_results: never
external_figures: none  # no figure from the public uplift datasets appears in this file or in any Phase 7 doc or README text

risk_input:
  probability: calibrated 30-day churn probability from classifier c01
  reason: matches a monthly renewal; the 7-day and 30-day probabilities can disagree for some customers until the ordering fix

segment:
  name: auto_renew
  column: last_is_auto_renew  # from the features at T, built only from rows dated before T
  levels: {"off": 0, "on": 1}
  missing: none  # counts-only check: no missing value on any 2016 snapshot (2016-11-01: 63,489 off, 166,797 on)
  never_used: [age, gender, registered_via, tenure, city]  # never a segment, an eligibility rule, a lever or a reason

actions:
  reminder:
    description: a renewal reminder sent before the paid expiry
    eligible: ["off", "on"]
  autorenew_prompt:
    description: a prompt to switch auto-renew on
    eligible: ["off"]  # not offered to customers whose auto-renew is already on
  discount:
    description: a price cut on the next renewal (depth set with the costs, before any run)
    eligible: ["off", "on"]
  none:
    description: no action; effect 0 and cost 0 by definition
    eligible: ["off", "on"]

one_action_per_customer: true

scenarios:
  levels: [low, base, high]  # low is 0 everywhere, so "no action" can come out best
  relative:
    role: primary
    form: relative cut of the calibrated 30-day probability; treated probability = p * (1 - cut)
    weakness: assumes the effect grows with risk
    cuts:  # fractions of p
      reminder:
        "off": {low: 0.0, base: 0.03, high: 0.08}
        "on": {low: 0.0, base: 0.0, high: 0.02}
      autorenew_prompt:
        "off": {low: 0.0, base: 0.04, high: 0.10}
      discount:
        "off": {low: 0.0, base: 0.10, high: 0.25}
        "on": {low: 0.0, base: 0.03, high: 0.10}
  absolute:
    role: registered alternative
    form: absolute cut in percentage points, flat across risk; treated probability = max(p - cut / 100, 0), so the effect never exceeds p
    weakness: assumes the effect is the same for a customer at 2% risk and one at 60% risk
    cuts_pp:
      reminder:
        "off": {low: 0.0, base: 0.5, high: 1.5}
        "on": {low: 0.0, base: 0.25, high: 0.75}  # half of the off values
      autorenew_prompt:
        "off": {low: 0.0, base: 1.0, high: 2.5}
      discount:
        "off": {low: 0.0, base: 2.0, high: 5.0}
        "on": {low: 0.0, base: 1.0, high: 2.5}  # half of the off values

wording:
  sentence_prefix: "Under the assumed <scenario> <level> effect"  # every sentence that uses an effect carries it

# --- population -----------------------------------------------------------------------
# The rows that already carry a calibrated 30-day probability in 2016: P2 main
# (in_exp30 and segment in paid, discount100_only) at 2016-10-01 and 2016-11-01.
# 2016-12-01 is never used; no 2017 snapshot is used.
population:
  rows: P2 main
  snapshots: [2016-10-01, 2016-11-01]

# --- customer value -------------------------------------------------------------------
# Every input below is an assumption or a model output, never an observed profit.
value:
  label: "assumed value: user choice, 2026-10-17, provisional"
  formula: margin * price_per_day * expected_paid_days_30_90
  price_per_day:
    row: last non-cancel transaction dated before T with actual_amount_paid > 0 and payment_plan_days > 0
    tie_break: latest transaction date, then latest expiry date, then highest amount paid
    value: actual_amount_paid / payment_plan_days
    no_usable_price: value 0, so no action can have positive net value; the count per snapshot is reported
  expected_paid_days_30_90:
    model: dt01 survival curve, shape only (raw curve, no calibration)
    rule: expected days not lapsed in (30, 90] given not lapsed by day 30
    computation: trapezoid on the interval ends 30, 37, 44, 51, 59, 67, 74, 81, 90 of S(t) / S(30)
    range_days: [0, 60]
  margin: {low: 0.3, base: 0.5, high: 1.0}  # revenue overstates value; KKBox has no costs
  extrapolation_scenario:
    role: labelled extrapolation, a scenario only, never the primary value
    label: "extrapolation beyond the survival model's range: user choice, 2026-10-17, provisional"
    rule: expected days not lapsed in (30, 365] given not lapsed by day 30; after day 90 the daily hazard of the 81-90 interval is held constant
  model_disagreement:
    statement: risk comes from c01 (calibrated 30-day probability) and value from dt01 (curve shape); they are different models and can disagree
    report: per snapshot, the count and share of customers in c01's top decile of risk whose dt01 30-day lapse probability is below dt01's snapshot median
    role: descriptive, no pass mark

# --- the dt01 refit -------------------------------------------------------------------
# dt01 was not saved in Phase 3, so it is refit once, registered here before it runs.
dt01_refit:
  settings: frozen Phase 3 choices (discrete_time, dt01), exactly as the test stage fits it
  fit_rows: P2 main rows of 2016-08-01 and 2016-09-01
  labels_as_of: 2017-01-01  # only transactions dated in 2016 enter; no 2017 outcome
  seed: 20161001
  threads: 4
  never: [score-test, TestUnlock, any 2017 outcome]
  memory_ceiling_gb: 10.0  # peak RSS reported; a breach is a failure
  reproduction:
    # Pass: every field of the refit's raw-score summary on the same P2 main rows,
    # in the same order, equals the logged one exactly (mean, nine deciles, min,
    # max as floats after the JSON round trip; distinct count as an integer).
    # Any difference: stop, exit non-zero, save nothing, report the difference.
    # Never loosened. Causes examined first: row order, a library version, threads.
    source: rehearsal.json
    cells:
      - {horizon: 7, snapshot: 2016-11-01, path: [primary, "7 days, 2016-11-01", models, survival_dt01, score_summary_raw]}
      - {horizon: 30, snapshot: 2016-11-01, path: [primary, "30 days, 2016-11-01", models, survival_dt01, score_summary_raw]}
      - {horizon: 59, snapshot: 2016-11-01, path: [demonstration_59, "59 days, 2016-11-01", models, survival_dt01, score_summary_raw]}
  saves_only_after_pass: booster text with its SHA-256, and S(t) at every interval end for the population rows

# --- action costs and lead times ------------------------------------------------------
costs:
  label: "assumed cost: user choice, 2026-10-17, provisional"
  unit: price units  # the currency of the KKBox price columns, not named in the data
  reminder: {low: 0.5, base: 1.0, high: 2.0}  # per customer contacted
  autorenew_prompt: {low: 0.5, base: 1.0, high: 2.0}
  discount:
    depth: 0.134  # KKBox's own 149 -> 129 price point
    rule: depth * (30 * price_per_day) * chance of renewing under the action
    chance_of_renewing: 1 - treated probability (as defined by the scenario's form)
    margin: not applied; the forgone price is counted in full
  none: 0
  budget_counts: expected cost (the discount's cost depends on the chance of renewing)

lead_time_days:
  reminder: 2
  autorenew_prompt: 2
  discount: 7
  deadline: days_until_paid_expiry at T  # observed at T; an action is skipped when its lead time exceeds it
  deviation: the deadline is the paid expiry date, not a predicted time to churn (observed, not modelled)

# --- budget ---------------------------------------------------------------------------
budget:
  unit: price units per snapshot, on the 20% sample
  levels: [0, 1000, 2500, 5000, 10000, 25000, 50000, no_limit]
  no_limit: every customer with positive net value gets the action with the highest net value
  zero: no action for anyone
  net_value: value * effect - cost  # value includes the margin; effect = the probability cut under the scenario

phone_call: not an action  # user decision, 2026-10-17

docs_rule: every number quoted in a doc comes from a logged run

# --- the optimizer --------------------------------------------------------------------
optimizer:
  problem: per customer, one eligible action or none; maximize the sum of net value; expected cost within the budget
  net_value_floor: none scores 0, so an action with negative net value is never chosen; unspent budget is reported, never forced
  plan_solver: greedy  # incremental steps per customer, funded in order of extra net value per unit of extra cost
  exact_check:
    solver: scipy.optimize.milp (HiGHS, bundled with scipy; no install)
    threads: 1
    determinism_test: two solves on the same input give the identical selection
    role: the check on the greedy plan; the plan solver only in the contact-limit case
  report: [lp_bound, greedy_objective, highs_objective, greedy_gap_to_lp_bound]
  deviation: OR-Tools and PuLP are not used; adding OR-Tools needs the user's approval first
  constraints:
    budget: expected cost of the chosen actions <= budget, summed with math.fsum and checked exactly after solving
    budget_repair: if a solver tolerance overshoots, chosen actions are removed in reverse greedy order (lowest efficiency first) until the plan fits; every repair is logged
    one_action_per_customer: true
    eligibility: from the actions section (autorenew_prompt only with auto-renew off)
    deadline: an action is allowed only if its lead time <= days_until_paid_expiry at T
    missing_deadline: no action allowed; the count per snapshot is reported
    contact_limit:
      primary: none
      case: {total_contacted_max: 5000, per: snapshot, label: "my choice, not KKBox capacity"}
  ties:
    row_order: rows sorted by msno ascending before any step
    ranking: score descending, then msno ascending
    greedy: efficiency descending, then net value descending, then msno ascending, then action order
    one_customer_equal_value: the cheaper action, then action order
    action_order: [reminder, autorenew_prompt, discount]

# --- comparison strategies ------------------------------------------------------------
# Every strategy uses the same scenario, budget and costs. The baselines differ from
# the optimizer only in who is targeted (best-action variants) or also in what they
# get (the fixed-action variant).
strategies:
  optimizer: as solved
  highest_risk: {rank_by: calibrated 30-day probability}
  highest_assumed_uplift_x_value:
    rank_by: the largest assumed effect x value over the customer's eligible actions
    label: the uplift is assumed, not estimated
  random: {draws: 1000, seed: "20161001 + draw number", report: [mean, p2_5, p97_5], range_label: "spread of random targeting, not a confidence interval"}
  no_action: net value 0 by definition
  baseline_actions:
    best_action: each targeted customer gets their eligible action with the highest net value, even when negative
    fixed_action: the reminder to every eligible customer, ranked by calibrated 30-day probability, within the budget
    reported: best_action for highest_risk, highest_assumed_uplift_x_value and random; fixed_action as its own row; both shown in every comparison table
  fill: walk down the ranking; add a customer when the action fits the remaining budget; otherwise skip and continue
  no_limit_budget: each baseline targets as many customers as the optimizer chose
  table_caption: "optimizer maximizes this quantity by design; the comparison is arithmetic on assumed effects"  # a test checks every comparison table carries it
  columns: [expected_retained_customers, expected_retained_value, expected_cost, net_value, budget_used, budget_unspent, contacted_by_action, effect_basis, form, level, margin, cost_level, budget]

# --- observed churn among targeted customers ------------------------------------------
observed_churn_check:
  label: "says nothing about whether any action works"
  measure: share of each strategy's targeted customers who lapsed within 30 days
  outcome_column: churned_30  # coverage-based, the target c01 was trained on
  read_path: retention.models.data.load_labels  # the lock-aware loader; no TestUnlock, 2016 snapshots only
  snapshots: [2016-11-01, 2016-10-01]
  read_once_per_snapshot: true  # one read, logged; never repeated
  registered_before_read: true

snapshots_roles:
  primary: 2016-11-01
  secondary: 2016-10-01
  secondary_caveat: 2016-10-01 contains the half of customers used to fit the Platt calibration, so its probabilities are partly in-sample

# --- sensitivity ----------------------------------------------------------------------
sensitivity:
  base_point:
    form: relative
    level: base
    margin: 0.5
    cost_level: base
    discount_cost_scaled_by_margin: false
    value_horizon_days: 90
    contact_limit: none
    snapshot: 2016-11-01
  variants:  # each changes the base point as stated, nothing else
    absolute: {form: absolute}
    low_effect: {level: low}
    high_effect: {level: high}
    margin_low: {margin: 0.3}
    margin_high: {margin: 1.0}
    cost_low: {cost_level: low}
    cost_high: {cost_level: high}
    discount_scaled_by_margin: {discount_cost_scaled_by_margin: true}
    value_365: {value_horizon_days: 365}  # the labelled extrapolation
    contact_limit: {contact_limit: 5000}
    pessimistic: {margin: 0.3, cost_level: high}
    optimistic: {margin: 1.0, cost_level: low, level: high}
  runs:
    primary: base point and every variant, at every budget level, on 2016-11-01 (104 greedy solves, each checked by HiGHS)
    secondary: base point only, at every budget level, on 2016-10-01 (8 solves)
    random_draws: 1000 at every scenario and budget

  stability:
    compared_with: the base plan at the same budget
    measures:
      regret:  # headline
        loss: variant optimum minus the base plan's net value scored under the variant, in price units
        relative: loss / variant optimum, when the variant optimum > 0
      jaccard: customers in both plans / customers in either plan; two empty plans = 1; empty against non-empty = 0
      action_agreement: among customers in both plans, the share given the same action
      budget_curve: net value against budget, with the extra net value per extra price unit between levels
      discount_rank: the discount's rank among actions by net value contributed, under both discount cost rules
    thresholds:
      label: "my choice, not based on data"
      stable: jaccard >= 0.70 and relative regret <= 0.10
      stricter_reading: {jaccard: 0.80, relative_regret: 0.05, role: "reported, not judged"}
    headline_budget:
      rule: the largest scan level strictly below the base plan's no-limit spend on 2016-11-01
      level: not yet registered
      procedure: >
        The no-limit spend needs customer value, which needs the dt01 refit, so it cannot
        be computed from counts before code exists. The value step computes and logs only
        the base plan's no-limit spend (no variant, no comparison, no outcome); the level
        then follows from the rule and is registered in its own commit before any variant
        or comparison is computed. If the spend is at or below the smallest positive level
        (1000), the headline budget is "no limit" and that is stated.
    verdict:
      per_variant_and_budget: stable or unstable by the thresholds
      headline: the verdict at the headline budget; every other budget reported with its own verdict
      low_effect: excluded from the overall verdict (zero effect empties every plan by design); its absolute loss, what the base plan spends if no action works, is its own headline number
      overall: 'the overall verdict is "robust within the registered ranges" only if every variant except low_effect is stable at the headline budget; otherwise "unstable", naming the variants that failed'
      does_not_decide_criterion_4: true  # an unstable plan is a finding, not a failure

  discount_rank_sentence:
    if_rank_changes: the discount's rank depends on whether its cost is scaled by margin
    if_rank_same: the discount's rank did not change in this run, but the choice of cost rule remains an assumption the result rests on

  unstable_report:
    - a plain statement that the plan is driven by assumptions, not data
    - the assumptions ranked by the loss they cause (largest first)
    - "the robust core: customers chosen in the base plan and in every variant except low_effect, as a count; if it is empty, a plain statement that no customer is chosen under every assumption"
    - one recommendation, a randomized holdout test of the action behind the largest loss; no deployment claim

  expectations:  # registered before any run, repeated beside the results
    - the low_effect variant gives an empty plan
    - the absolute form is likely the least stable (a flat effect favours high-value customers whatever their risk)
    - the margin and cost variants mostly change spend more than who is targeted

# --- pass marks -----------------------------------------------------------------------
pass_marks:
  done_when:
    budget_and_capacity:
      tests: hand-made cases whose optimum is known by trying every combination; random small cases checked against HiGHS
      runtime_guard: every real solve checks expected cost <= budget and contacts <= the limit; any breach on any solve = not met
    comparison_exists: reports/strategy_backtest.md with the captioned comparison tables for 2016-11-01 and 2016-10-01
    readme_statement: the README states that KKBox backtest figures are model estimates under assumed effects, not observed outcomes
  sensitivity_complete:  # criterion 4, ours
    - all 104 primary solves and the 8 secondary solves ran
    - every output row carries effect_basis, form, level, margin, cost level, discount cost rule, value horizon and budget (a test and a runtime check)
    - the stability table and the verdict sentences follow the rules above
  solver_checks:  # a failure stops the run
    highs_not_below_greedy: HiGHS objective >= greedy objective - 1e-6
    greedy_within_bound: greedy objective >= LP bound - the largest single customer net value
    highs_deterministic: two HiGHS solves give the identical selection
  resources: {memory_ceiling_gb: 10.0, threads: 4}

tests_required:
  - a hand-made pair of plans that must be judged "unstable"
  - a hand-made customer whose last row paid 0 with an earlier paid row; the price comes from the earlier paid row
  - every comparison table carries the registered caption

# --- wording rules and the run-time stop ----------------------------------------------
wording_rules:
  effect_sentence_prefix: "Under the assumed <form> <level> effect"  # every sentence that uses an effect, a retained value or a net value
  fixed_disclaimers:  # used verbatim by the report; removed before the banned-word scan
    - "KKBox backtest figures are model estimates under assumed effects, not observed outcomes."
    - "No KKBox customer was ever given these actions, so nothing here shows that any action causes a customer to stay."
    - "optimizer maximizes this quantity by design; the comparison is arithmetic on assumed effects"
    - "says nothing about whether any action works"
  banned_words:  # whole words, case-insensitive, outside the fixed disclaimers
    - cause
    - caused
    - causes
    - causing
    - proves
    - proved
    - guarantee
    - guarantees
    - guaranteed
    - retain
    - retains
    - will retain
    - save
    - saves
    - saved
    - saving
    - will save
    - prevent
    - prevents
    - prevented
    - preventing
    - keeps
    - works
  retained_allowed_only_in: ["expected retained customers", "expected retained value"]  # the registered quantity names
  uplift_allowed_only_as: "assumed uplift"
  works_exception: "says nothing about whether any action works"  # exact string; the only allowed "works"
  external_figures_ban:
    names: [Hillstrom, Criteo]
    scope: [reports/strategy_backtest.md, "README.md section Budget optimizer", "configs/actions.yaml outside this entry", src/retention/optimize]
    exempt: [docs/uplift_validation.md, docs/causal_assumptions.md, docs/counterfactuals.md]  # Phase 6 docs keep their own public-data figures
  money_unit: price units

random_baseline_timing:
  measure: 1000 draws on synthetic data at the 2016-11-01 row count, before the real plan run; logged
  projection: measured seconds per scenario-budget cell x 112 cells
  stop_hours: 3.0  # the plan step refuses to start above this projection
  recheck: after the first real cell, project again from its measured time; stop above 3 hours

# --- the exact check's time limit -------------------------------------------------------
exact_check:
  label: "HiGHS time limit: user choice, 2026-10-17"
  time_limit_seconds: 120  # per solve
  threads: one requested; scipy.optimize.milp (1.17.1) has no thread option, so the run-twice check is the evidence
  proven: HiGHS reports an optimal solution within the limit
  budget_only_cells:
    proven: the mark "HiGHS objective >= greedy objective - 1e-6" applies; a breach stops the run
    unproven: 'greedy stays the plan; the cell is marked "exact_check: not proven" and greedy''s gap to the LP bound is reported'
  contact_limit_cells:
    proven: HiGHS's solution is the plan
    unproven: 'HiGHS''s best feasible solution is the plan only if its net value is at least greedy''s; otherwise greedy''s (cut to the contact limit by the registered repair, lowest net per cost removed first); the cell is marked "exact_check: not proven"'
  greedy_mark_applies_to: proven solves only
  determinism_check: compared only when both solves are proven; otherwise reported as not checked
  unproven_report:
    count: the number of unproven cells out of the 112, always reported
    statement_above_share: 0.10  # above this share the report states plainly that the exact check is limited (a finding, not a failure)
  every_plan: never over budget or the contact limit, checked on every plan, proven or not
  timing: the 3-hour projected stop stays; actual seconds per cell are logged
