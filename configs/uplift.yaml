# Phase 6: uplift on KKBox, the design registered before any outcome is read.
# Committed alone. Sections for the propensity model, the learners, the
# randomized-data validation and the customer groups are added in later
# commits, each before the runs it judges. A change after a result is seen
# is a logged amendment, and the original result is reported alongside.
# Counts below come from a counts-only run on the 20% sample that read the
# renewal rows' own amounts and pre-T label columns; no outcome column was read.

kkbox:
  sample: sample_020
  label_family: paid  # the coverage-based family counts 100%-discount and trial rows as renewals, so a discount outcome would be partly mechanical

  unit:
    rule: one renewal event
    member_at_T: paid coverage active at T and the paid expiry at T inside T's calendar month
    renewal: first non-cancel transaction dated on or after T and on or before the paid expiry at T plus 30 days
    tie_break: lowest row_id among rows on the same transaction date
    one_unit_per_renewal: each paid expiry lies in one calendar month, so each renewal row belongs to exactly one snapshot (checked over 2016-01 to 2016-11, 1,585,654 units, 1,585,654 distinct rows)
    snapshot_role: covariates only (features at T use rows dated before T)
    treatment_from: the renewal row's own plan_list_price and actual_amount_paid
    same_day_same_plan_cancel: the renewal stands; such a cancel keeps the subscription's expiry and only marks auto-renew as off, as in the labeller (2 of the 932 method-23 units have one)

  treatment:
    treated: plan_list_price > 0 and actual_amount_paid > 0 and 1 - actual_amount_paid / plan_list_price >= margin
    untreated: plan_list_price > 0 and actual_amount_paid = plan_list_price
    margin: 0.05
    margin_reason: >
      Real discounts sit at depth 0.134 (list 149, paid 129) and 0.336 (list 149, paid 99).
      The only other below-list rows in the whole table are list 150, paid 149 (depth 0.007,
      3 rows), which looks like rounding. Any margin from 0.01 to 0.13 gives the same treated set.
    pooled_levels: both depths are one treatment; 69 analysed units are at 0.134 and 1 at 0.336
    payment_method: 23  # the only method with any discounted renewal in 2016
    plan_days: 30  # every discounted renewal is a 30-day plan; untreated renewals use the same plan

  outcome:
    name: paid churn at E
    E: the renewal row's expiry_date
    rule: 1 if the paid-based lapse date (T + paid_days_to_event, with paid_event_observed = 1) is on or before E; 0 if paid coverage continues past E
    labels_as_of: 2016-12-31  # paid-based labels rebuilt from transactions dated on or before this date, so no 2017 transaction enters
    read_path: lock-aware loader, snapshot T labels only
    window_rule: E before 2016-11-05, so that [E, E + 30] ends by 2016-12-31 and does not contain 2016-12-05 (a missing renewal day)

  months:
    snapshots: [2016-07-01, 2016-08-01, 2016-09-01, 2016-10-01]
    month_is_covariate: true  # snapshot-month indicators
    month_reason: >
      Within method 23 the discount is mostly decided by calendar month and starts in
      September 2016, the month of a known level shift. Without month as a covariate the
      September treated would be compared with July and August renewers, so the shift would
      be read as a discount effect.
    structural_overlap_rule: drop a month with no treated or no untreated unit before any model
    overlap_effect: >
      2016-07 (0 treated, 311 untreated) and 2016-10 (1 treated, 0 untreated) are dropped.
      2016-08 (2 against 308) and 2016-09 (68 against 242) remain, so the estimate is in effect
      a within-September comparison.

  exclusions:
    other_payment_methods: no discounted renewal in the 2016 window (method 41 alone has 981,641 full-price first renewals over 2016-01 to 2016-11 and none discounted)
    plan_days_not_30: all discounts are 30-day plans; removes 25,911 full-price or discounted units over 2016-01 to 2016-11
    discount100: list > 0, paid 0; a separate group, not part of the treatment contrast and not analysed here (137 to 227 first renewals a month in 2016)
    trial_and_promo: list price 0, so not a discount
    blank_plan: list price 0 with money paid; none in 2016
    above_list: paid above list; none in 2016
    year_2015: left-truncation risk; the 2015 method-41 discount (list 149, paid 119) is not used
    2016-01_and_2016-02: left-truncation risk
    2016-03_and_2016-05: unreliable months
    2016-04_and_2016-06: uncertain months
    2016-11: the window rule leaves no unit
    2016-12_and_2017: never; no 2017 outcome is read, no test unlock is constructed, the test score is never run

  counts_before_outcome:  # the build recomputes these and stops if any differs
    registered_set_all_methods: 464751  # full price or discounted, plan 30, window rule, 2016-07 to 2016-10
    method_23: 932  # 71 treated, 861 untreated
    share_with_zero_chance: 0.998  # units on other methods
    method_23_by_month:
      2016-07: {treated: 0, untreated: 311}
      2016-08: {treated: 2, untreated: 308}
      2016-09: {treated: 68, untreated: 242}
      2016-10: {treated: 1, untreated: 0}
    analysed: {treated: 70, untreated: 550}

  expectations:
    power: >
      The estimate is expected to be underpowered or not estimable. A wide interval or
      "not estimable" is a legitimate outcome and is reported as such.
    min_treated_after_trimming: 30  # below this the effect is reported as not estimable, with no number given as a finding
    min_untreated_after_trimming: 30  # added with the propensity design, after the feature counts and before any outcome; same consequence
    identification: >
      About 99.8% of renewers in the registered months are on payment methods that never
      received a discount in 2016, so their chance of a discount is zero and the effect
      cannot be identified for them. The estimate applies only to method-23 renewers in
      months where both arms exist, and only to customers who renewed at that event.

  robustness:
    placebo:
      idea: the real treatment, dated after T, against an outcome fixed before T must show zero effect
      outcome: days with listening in days T-56 to T-29 (the 28 days before the covariate window), from the daily logs
      excluded_from_covariates: true
      estimator: the same units, trimming and learners as the primary estimate
      pass: the 95% bootstrap interval of the average effect contains 0
      if_fails: the KKBox estimate is reported as failing its assumption check, not as a finding
      power_note: with 70 treated the placebo detects only large imbalances; a pass is weak evidence
    trimming_sensitivity:
      rules: the primary trimming rule, no trimming, and one stricter rule, all registered with the propensity design before any outcome is read
      sensitive_if: the sign of the point estimate changes, or one rule's interval excludes 0 while another's does not
    margin_sensitivity: not used as a robustness check; any margin from 0.01 to 0.13 gives the same treated set, so the check would be empty
    implausible_effect: an interval entirely on the side of discounts raising churn is reported as evidence that the assumptions fail, not as a finding that discounts cause churn

  propensity:  # added in a second commit, after feature counts on the analysed units and before any outcome is read
    units: the analysed units (2016-08 and 2016-09, method 23), features at T
    model: L2-regularised logistic regression on standardised inputs (scikit-learn LogisticRegression)
    why_not_trees: with about 70 treated units, tree models overfit and push scores toward 0 and 1, which makes trimming arbitrary
    covariates:
      base: feature set fs1 (40 columns, all built from rows dated before T)
      profile_columns: excluded (age, gender, city, profile_blank); the members table is a post-data snapshot whose presence depends on later activity
      members_columns: tenure_days and registered_via kept, null when there is no listening before T (the fs1 column has_any_log_before_T marks those units); registered_via may stand in for plan type or payment channel, so part of what it adjusts for may be the assignment itself
      snapshot_month: indicator for 2016-09
      added_after_counts:
        name: any_discount_365  # 1 if n_discounted_365 > 0 (a discounted or 100%-discount row in the 365 days before T), else 0
        reason: >
          Added after counting pre-T features of the analysed units, before any outcome.
          65 of 68 September treated units have a discount in the past year, against 25 of 242
          September untreated units; last_discount_ratio, the only discount column in fs1, is
          constant (0 for all 620 units). Every such earlier row is method 23, list 149, paid 129.
      not_in_model:
        name: days_since_last_discount  # T minus the date of the latest discounted row in the 365 days before T
        reason: it separates the arms completely in September (treated units' earlier discount 2015-11 to 2016-08, untreated 2015-09 to 2015-10), so it would leave no overlap; the separation is evidence about how discounts were assigned, not a covariate
        diagnostic: its SMD is reported, on units with a past-year discount only, and is not judged
    preprocessing:  # every rule is fitted on the training folds only, except the column rules below, which use the 620 units' feature values
      constant_columns: dropped (7 expected from the counts, namely segment, paid_state, last_plan_days, last_plan_days_missing, last_discount_ratio, last_row_kind, last_row_is_cancel)
      rare_level_rule: a binary column, or a categorical level, held by fewer than 5 units is dropped (expected to drop last_is_auto_renew and last_payment_method_id, 1 unit each)
      categorical: registered_via one-hot, null as its own level "missing"
      numeric_nulls: filled with the training-fold median, with a 0/1 flag per column
      duplicate_columns: after encoding, a column identical to an earlier one is dropped (for example a null flag identical to has_any_log_before_T)
      scaling: standardised with training-fold mean and standard deviation
    penalty:
      C_grid: [0.01, 0.1, 1, 10]  # inverse regularisation strength, lambda = 1 / C
      chosen_by: mean out-of-fold log loss of treatment over the folds (treatment only, never the outcome); ties go to the smaller C
      folds: StratifiedGroupKFold, 5 splits, grouped by customer (305 customers appear in both months), stratified by treatment, shuffle with seed 0
      propensity_used: out-of-fold predictions from the same folds with the chosen C
      threads: 4
    overlap_check:  # reported
      per_arm: minimum, quartiles and maximum of the propensity; a histogram per arm
      outside_primary_band: units per arm outside [0.05, 0.95]
      effective_sample_size: Kish effective sample size of the weights per arm, after primary trimming
    trimming:
      primary: {low: 0.05, high: 0.95}  # keep units with propensity inside the band
      stricter: {low: 0.10, high: 0.90}  # a conventional rule of thumb, registered here as a chosen value
      none: {low: 0.0, high: 1.0}
      refit_after_trimming: false
      both_arms: true
    estimability: at least 30 treated and 30 untreated after primary trimming; otherwise the KKBox effect is reported as not estimable, while the propensity, overlap and balance tables are still reported
    weights:
      kind: stabilised inverse-probability weights  # treated p / e, untreated (1 - p) / (1 - e), p = treated share of the trimmed group
      estimand: average effect in the trimmed group
    balance:
      smd: (weighted mean treated - weighted mean untreated) / sqrt((var treated + var untreated) / 2), variances unweighted, within the trimmed group
      zero_variance: if both arms' variances are 0 the SMD is 0 when the means are equal, otherwise the column fails
      null_fill: numeric nulls are filled with the pooled median of all analysed units (before trimming), never a training-fold median; the 0/1 null flags are balance columns too; reason, balance describes the group as a whole, a fold median would fill the same value differently by fold, and one fill keeps the before-and-after and the three trimming rules comparable  # added after the balance code was written, before any propensity fit
      columns: every model input after preprocessing (each flag, each registered_via level, the month indicator, any_discount_365)
      pass: every |SMD| <= 0.10 after weighting
      reported: SMDs before weighting; variance ratios (not judged); the days_since_last_discount diagnostic
      if_fails: the KKBox estimate carries the label "balance not met" and is not reported as a finding; the propensity model is not respecified
      expected_case: with about 65 treated against 25 untreated after trimming, the standard error of an SMD is near 0.24 (sqrt(1/65 + 1/25)), so the mark may fail from noise alone
    sensitivity_without_members_columns: the same pipeline without tenure_days and registered_via (has_any_log_before_T stays, as a usage column)

  outcome_read:  # added after the propensity step (estimable, balance not met) and before any KKBox outcome is read
    decision: the outcome is read once, as registered, because the estimability mark is met (62 treated, 51 untreated after primary trimming); no new stop rule is added after seeing the balance result
    label: every KKBox output carries "balance not met"; no KKBox estimate is reported as a finding
    table_order: every table gives the 95% interval before the point estimate
    placebo_first: the placebo is computed and reported before any effect estimate, with its power limit
    placebo_power_limit: >
      Smallest difference detected with 80% probability at the 5% level, 2.8 * sqrt(1/n_treated + 1/n_untreated)
      standard deviations of the placebo outcome: about 0.53 with the 62 and 51 kept units, and about 0.74 with the
      weighted effective sample sizes (26.5 and 31.9). The earlier figure for 65 against 25 is 0.66 (2.8 * sqrt(1/65 + 1/25) = 0.659), first written as 0.67 in error.
    expected_reading: >
      With balance not met (21 of 37 inputs above 0.10 after weighting) and the timing of the past discount
      separating the arms almost completely (days_since_last_discount SMD -1.10 before weighting and -1.41 after),
      the KKBox effect is unlikely to be identified. The report reads "balance not met, assumptions unsupported"
      unless the registered checks show otherwise.

  outcome_step:  # registered before any outcome-step code is written and before any KKBox outcome is read
    unit_horizon: >
      For every analysed unit, discounted or not, E is the expiry date on its own first renewal row after T
      (for untreated units, the full-price renewal). With every plan exactly 30 days, the horizon from the
      renewal to E has the same length in both arms, which is why plan length is restricted to 30 days. Units
      whose E is on or after 2016-11-05 are not analysed; a hand-case test covers one.
    bootstrap: >
      1000 resamples, seed 0. Each resample draws customers with replacement from all 620 analysed units, and a
      drawn customer brings all of their units. The propensity is refit on the resample with C = 1 on new
      customer-grouped folds; the trimming membership of the original run is kept; the outcome models are refit
      on the kept units.
    interval_scope: the interval covers sampling variation given the trimmed set, not the uncertainty of the trimming itself; every output says so
    not_computable: >
      A resample in which a kept unit has a propensity of exactly 0 or 1, or in which a fold leaves an arm with
      fewer than 2 units to train on, is not computable. If any resample is not computable, the interval is
      labelled "not computable" with the reason and no interval is formed from the other resamples.
    expected_not_computable: the untrimmed estimate is probably not computable (propensities near 0 and 1); that is a result, not a code failure
    outcome_models: LightGBM classifiers for churn and LightGBM regressors for the placebo, at the fixed KKBox setting (learners.kkbox_fixed); the X-learner's second-stage models are cross-fitted on the same folds
    placebo:
      outcome: distinct days with a log row in days T-56 to T-29, inclusive
      covariates: exactly as registered (same units, trimming and learners as the primary estimate)
      window_test: the placebo window is disjoint from and adjacent to the 28-day window (T-28 to T-1) of every windowed feature; days_since_last_listen, has_any_log_before_T and first_log_in_window read all listening history and are named as known exceptions
      leak: >
        Those three covariates fix or bound the placebo value for 17 of the 113 kept units (7 full price,
        10 discounted): never listened, first listen in the last 28 days, or last listen more than 56 days ago
        fix it at 0; last listen 29 to 56 days ago bounds it at 1 or more. Adjustment removes any placebo
        difference for those units mechanically, which pulls the placebo toward zero and makes an already weak
        check (about 0.53 SD detectable by counts, 0.74 SD with weighting) weaker. A zero placebo is therefore
        weak evidence. The count comes from a counts-only check of pre-T data; the placebo step logs it and stops
        if it differs.
    timing: time per resample is measured on the first 10 resamples of each bootstrap; the run stops if the projected total for the whole step exceeds 3 hours
    sensitivity_without_members: if estimable but balance fails, the same "balance not met" label applies; if not estimable, it is reported as such
    reading: balance has failed under the registered rule and the label is never lifted, so the report reads "balance not met, assumptions unsupported" whatever the estimates show
    # constant_fits: registered after the build, before the outcome command runs
    constant_fits: >
      If every training outcome in an arm and fold is the same value, that arm's prediction in that fold is the
      value itself (0 or 1), and the fit is counted as degenerate (logged per fit). The output reports
      "outcome models were degenerate in X of Y fits" for the main estimate and for the bootstrap (summed over
      resamples). If more than 10% of the main estimate's fits are degenerate, or any cross-fitted fold of the
      primary run is, the report says so next to the estimate and explains that the T- and X-learner effects
      are then close to a single arm's predicted rate. The rule never changes the "balance not met" label and is
      not a reason to rerun.
    recovery_tests:
      data: synthetic randomized set, n = 4000, seed 0, half treated, base rate 0.30, effect +0.10 where x1 > 0 and 0 otherwise, so the true average effect is 0.05
      pass_average: each of the T-learner, X-learner and AIPW averages within 0.05 +/- 0.04
      pass_heterogeneity: each learner's mean effect for x1 > 0 exceeds its mean for x1 <= 0 by at least 0.04
      if_fails: reported as found; no retuning and no larger sample afterwards

  downstream:
    budget_optimizer: >
      KKBox cannot supply a customer-level effect for any action. The budget step treats
      every discount, reminder or call effect as a labelled assumption, not an estimate.

learners:  # added in a third commit, before any outcome is read and before any public dataset is downloaded
  base_model: LightGBM, written in the project (no uplift library)
  t_learner: one classifier per arm on the outcome; the effect for a unit is the treated model's predicted probability minus the untreated model's
  x_learner:
    stage_1: the T-learner's two classifiers
    imputed_effects: treated units Y - mu0(x), untreated units mu1(x) - Y, with mu predictions taken out-of-fold
    stage_2: one LightGBM regressor per arm on that arm's imputed effects
    combine: tau(x) = e(x) * tau0(x) + (1 - e(x)) * tau1(x)
    e: KKBox, the registered out-of-fold propensity; randomized data, the treated share of the training split
  causal_forest: skipped  # about 90 renewals leave a forest nothing to split; T- and X-learners are enough for the Qini test
  cross_fitting:
    folds: 5
    kkbox: the propensity's customer-grouped folds (StratifiedGroupKFold, stratified by treatment, seed 0); every effect for a unit comes from models that did not see it
    public_training_split: StratifiedKFold by treatment, shuffle, seed 0, used for the out-of-fold stage-1 predictions and for grid selection
    public_evaluation_split: scored by models refit on the whole training split with the chosen grid point; never used for any choice
  public_grid:
    n_estimators: [100, 300]
    num_leaves: [4, 15]
    min_child_samples: [20, 100]
    learning_rate: 0.05
    chosen_by: 5-fold cross-validated loss on the training split only (log loss for classifiers, squared error for stage-2 regressors), per base model
    ties: fewer trees, then fewer leaves, then larger min_child_samples
  kkbox_fixed:  # no search: tuning on about 25 untreated renewals is meaningless
    n_estimators: 100
    num_leaves: 4
    min_child_samples: 10
    learning_rate: 0.05
  lightgbm_common: {seed: 0, deterministic: true, n_jobs: 4, verbose: -1}
  kkbox_average_effect:
    estimator: AIPW  # mean of mu1 - mu0 + T (Y - mu1) / e - (1 - T) (Y - mu0) / (1 - e), with out-of-fold mu and e, over the trimmed group
    beside_it: the averages of the T-learner and X-learner effects over the same group
    interval: customer bootstrap, 1000 resamples, seed 0, 95% percentile interval; each resample refits the propensity (C fixed) and the outcome models; trimming membership stays fixed
  naive_difference:
    kkbox: outcome rate of discounted minus full-price renewals, on the analysed set and on the trimmed group, with the same bootstrap
    public: outcome rate of treated minus control on the evaluation split, with a customer bootstrap (1000 resamples, seed 0)
    role: reference; on KKBox it shows the bias the adjustment is meant to remove; on randomized data it is an unbiased average effect
  public_sanity_mark: each learner's average predicted effect on the evaluation split lies inside the naive difference's 95% interval (reported per dataset, outcome and learner)
  kkbox_not_estimable:
    rule: if primary trimming leaves fewer than 30 treated or fewer than 30 untreated renewals
    then: the registered KKBox outcome is "not estimable"; the outcome is never read for KKBox; no learner, AIPW, naive difference or placebo runs on KKBox; no exploratory estimate on the untrimmed set
    reason: the untrimmed set contains units with no overlap, and any number from it would be quoted
    report: the KKBox robustness checks are met in design (registered) and not met in execution (the estimability mark stopped the run); the uplift criterion rests on the Hillstrom and Criteo validation

validation:  # added in a fourth commit, before either public dataset is downloaded and before any model runs
  purpose: test whether the learners rank customers by effect where treatment was randomized; it validates the method, not the KKBox assumptions
  datasets:
    hillstrom:
      source: http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv
      citation: Kevin Hillstrom, MineThatData E-Mail Analytics and Data Mining Challenge, March 2008
      terms: no license is stated, so the file is treated as all rights reserved; downloaded for local use only, never hosted, copied into the repository or any image
      expected_bytes: 3964977  # Content-Length read from the response headers before download
      checks: record the SHA-256 at download (plain HTTP, no published checksum); 64,000 rows; three arms of about one third each (Mens E-Mail, Womens E-Mail, No E-Mail); stop if any check fails
      sha256: 0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece  # recorded at download on 2026-10-16; proves later integrity, not authenticity (plain HTTP, no published checksum)
      local_file: data/raw/hillstrom/hillstrom_2008-03-20.csv
      expected_rows: 64000
      expected_columns: [recency, history_segment, history, mens, womens, zip_code, newbie, channel, segment, visit, conversion, spend]  # compared case-insensitively; segment holds the arm
      arm_share_tolerance: 0.01  # each arm's share within 1/3 +/- 0.01; set before the file is parsed
      features: [recency, history, mens, womens, zip_code, newbie, channel]  # history_segment dropped as a banded copy of history
      treatment_arms: {mens_vs_none: Mens E-Mail, womens_vs_none: Womens E-Mail}
      control_arm: No E-Mail
    criteo:
      source: Hugging Face dataset criteo/criteo-uplift, file criteo-research-uplift-v2.1.csv.gz, pinned to revision 2424920019e49d52d72c13ac1143ec5d53af276b
      official_page: https://ailab.criteo.com/criteo-uplift-prediction-dataset/  # refused the connection when checked; the license comes from the mirror's card
      license: CC BY-NC-SA 4.0 (attribution, non-commercial, share-alike); this project is non-commercial; never hosted or copied into the repository or any image
      citation: Diemert, Betlei, Renaudin and Amini, A Large Scale Benchmark for Uplift Modeling, AdKDD 2018 workshop (KDD 2018); cited in the docs
      expected_bytes: 311422618
      expected_sha256: 2716e1bf0fd157a93b5bf86924d9088419dfbac2022c6cd90030220634f616dc  # the mirror's published LFS hash at the pinned revision
      checks: SHA-256 equal to expected; 13,979,592 rows; columns exactly f0 to f11, treatment, visit, conversion, exposure; treatment share about 0.85; stop if anything differs
      local_file: data/raw/criteo_uplift/criteo-research-uplift-v2.1.csv.gz
      expected_rows: 13979592
      expected_columns: [f0, f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, treatment, conversion, visit, exposure]  # as a set
      treatment_share: 0.85
      treatment_share_tolerance: 0.005  # set before the file is parsed
      row_count_conflict: the mirror's card also says "25M rows"; the row count of the downloaded file decides, and the conflict is resolved and written down before any model runs
      storage: read from the compressed file into Parquet; the CSV is never unpacked to disk
      features: [f0, f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11]
      never_a_feature: exposure  # recorded after assignment; the analysis uses the assigned treatment (intent to treat)
  split:
    hillstrom: one 50/50 split of all 64,000 customers, stratified by the three arms, seed 0; both comparisons use it
    criteo: 50/50, stratified by treatment, seed 0
    criteo_grid_subsample: a fixed 1,000,000-row subsample of the training half, stratified by treatment, seed 0, used only for grid selection; the chosen setting is refit on the whole training half
    evaluation_half: never used for any choice
  cells:
    primary: [hillstrom_mens_vs_none_visit, hillstrom_womens_vs_none_visit, criteo_visit]
    secondary: [hillstrom_mens_vs_none_conversion, hillstrom_womens_vs_none_conversion, criteo_conversion]  # reported, not judged; conversion is sparse (Criteo average conversion rate 0.29% on the mirror's card)
    shared_control: the two Hillstrom cells share the No E-Mail arm, so they are not independent
  learner_judged: x_learner  # registered before any result; the T-learner is reported beside it
  qini:
    ranking: evaluation customers by predicted uplift, descending; ties broken by a fixed random key, seed 0
    cut_points: 100 equal-size cut points, phi = 0.01 to 1.00
    curve: Q(phi) = (treated outcomes in the top phi - control outcomes in the top phi * N_T(phi) / N_C(phi)) / N
    area: A = mean over the 100 cut points of (Q(phi) - phi * Q(1)); a random ranking scores 0 in expectation
    interval: customer bootstrap with Poisson(1) weights, 1000 resamples, seed 0, 95% percentile interval
    interval_note: the Poisson weights keep the ranking fixed, so the interval covers evaluation sampling only, not model-training variation
  baselines:
    random: a seeded random ranking (seed 0), shown as the diagonal
    outcome_probability: one LightGBM classifier on the pooled training split, treatment not a feature, same grid and selection rule, ranking by predicted outcome probability
  pass_marks:
    beats_random:
      a: the lower end of the 95% interval of A is above 0
      b: A >= 0.10 * Q(1) / 2, i.e. the model adds at least 10% to the area under the random diagonal
      b_judged_when: the naive difference's 95% interval lies entirely above 0
      if_b_not_judged: a cell passing (a) is reported as "passed on (a) alone; average effect not distinguishable from zero" and counts as not met
    done_when_first_criterion: met only if every primary cell passes both (a) and (b)
    beats_outcome_ranking:  # secondary, reported, not part of the Done-when
      rule: the lower end of the paired-bootstrap 95% interval of (A of the X-learner - A of the outcome-probability ranking) is above 0
      if_beats_random_but_not_outcome_ranking: reported as found, that uplift modelling added nothing over targeting by risk on that dataset
    sanity: see learners.public_sanity_mark
  expected_case: the Hillstrom email effects are small and its features are few, so a failing Hillstrom cell is plausible
  if_not_met: the cell is reported as "not met" with A, its interval and the curve; uplift models often fail to beat random on weak features, which is a legitimate outcome; no retuning, no new learner, no new split
  tests_before_real_data:  # hand-made cases with known answers, written and passing before either dataset is read
    - a perfect ranking (by the true effect, in a synthetic case with known potential outcomes) gives a larger area than each of 1,000 seeded random rankings
    - a random ranking gives an area near 0 over many seeds
    - a reversed ranking gives a negative area equal in size to the perfect ranking's on a hand case with equal treated and control counts in every cut (the curve's N_T / N_C scaling makes this exact only then)
    - a small hand case whose area is computed by hand
