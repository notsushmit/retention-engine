# Phase 8: scoring service. Registered before any Phase 8 code or run.
# Committed alone. The first commit registers the ordering fix and the 59-day
# refit; later sections are added in their own commits, each before the code or
# run it judges. No value here is changed after a result is seen: a later change
# is a logged amendment, and results under the original values are reported too.
# The scoring contract and the streaming pass marks were added in the second
# commit, before any build.
# The API labels and the wording rules were added in the third commit, before any
# build.
#
# Every pass mark is exact unless a tolerance is written next to it. If a
# reproduction field differs, the step stops and reports the largest difference;
# row order, library versions and thread count are examined first. No tolerance
# is introduced afterwards.

ordering:
  # The ordering fix registered in Phase 3, unchanged.
  horizons: [7, 30, 59]  # lapse by day 59, not 60 (a deviation from the phase plan's 60 days)
  order: [calibrate, clip, pool_adjacent_violators, clip]
  clip: [1.0e-6, 0.999999]
  pav_weights: equal
  property: "p7 <= p30 <= p59 on every row after the fix"

  refit_59:
    model: c01  # inherits the 30-day fold's choice; no fold chose settings at 59 days
    feature_set: fs1
    target: lapse by day 59
    fit_snapshots: ["2016-08-01", "2016-09-01"]
    fit_population: P2 main
    labels_as_of: "2017-01-01"  # cached labels only; no label building
    threads: 4
    seed: 20161001
    never: [read any 2017 outcome, construct TestUnlock, run score-test]
    status: demonstration-grade  # no fold chose its settings; calibration judged only in the Phase 3 59-day demonstration

  platt_59:
    slice: calibration half of 2016-10-01, P2 main
    labels_as_of: "2017-01-01"
    caveat: >-
      renewal windows run to 2016-12-29 and include the 2016-12-05 missing-renewal
      day; a customer whose renewal was due that day can be counted as lapsed, so
      these values may be slightly high (size not estimated)

  pass_marks:
    reproduction:
      source: data/processed/kkbox/sample_020/rehearsal.json
      source_sha256: 79cf47d49831d1e0cd0c1009816abd963d810d7867bf852431ba0bdb43a16ca6
      key: "demonstration_59 / 59 days, 2016-11-01 / models / classifier / score_summary_raw"
      snapshot: "2016-11-01"
      population: P2 main
      fields: 13  # mean, 9 deciles, min, max, distinct
      tolerance: exact
      expected:
        mean: 0.06730564963246764
        deciles:
          - 0.011126644718503055
          - 0.013732393068438547
          - 0.016551046580978244
          - 0.01875006284396744
          - 0.023477007922971263
          - 0.030022366348082582
          - 0.03792667875747765
          - 0.06816764329627534
          - 0.16823298746746904
        min: 0.008868385191557537
        max: 0.9539826748681025
        distinct: 93640
    platt_59:
      source: MLflow run 9bca205ae00b4017a440d16057fa60e8, artifact october.json, classifier_c01.platt.59
      tolerance: exact
      a: 0.02725170409239291
      b: 1.0132027145157536
    fix:
      snapshot: "2016-11-01"
      population: P2 main
      rows: 169673
      models: {7: saved booster, 30: saved booster, 59: refit}
      rows_changed: 16444  # exact
      max_change: 0.300535285645459
      max_change_tolerance: 1.0e-12
    determinism:
      in_process_refits: 2  # identical booster string required
      save: second run with the expected SHA-256 only
      serving: refuse any model file whose SHA-256 differs from the registered one
    monotone:
      property_test: seeded random inputs; every row satisfies p7 <= p30 <= p59
      real_check: every 2016-11-01 P2 main row after the fix; stop on any violation

  descriptive:  # no pass mark
    calibration_before_after_fix:
      horizons: [7, 30]
      slice: selection half of 2016-10-01, P2 main (72,395 rows)
      labels_as_of: "2017-01-01"  # 2016 outcomes only
      report: [slope, intercept]

  reasons:
    horizons: [7, 30]  # no reasons at 59 days
    explain: the probability before the fix  # said next to the final probability wherever both are shown

contract:
  score_request:
    endpoint: POST /score
    fields: {msno: required, as_of: optional}
    features_from: the service's own store  # callers never post feature values
  store_date: >-
    one date per loaded snapshot; during replay the store holds features for
    exactly one date T, built from rows dated before T
  population: P2 main  # in_exp30 and segment paid or discount100_only

  scored:  # status "scored"
    risk:
      horizons: [7, 30, 59]
      value: after the ordering fix, full precision, plus display text
      grade_59: demonstration
      flag: whether the ordering fix moved this customer's values
    reasons:
      horizons: [7, 30]
      phrases: configs/reason_phrases.yaml
      with: the probability before the fix
      fixed_line: "Reasons explain the probability before the ordering fix."
    lapse_free_days:
      horizon: 60
      model: dt01
      labels:
        - "uncalibrated between 7, 30 and 59 days"
        - "near the ceiling for almost everyone; not a ranking signal"
    archetype:
      value: null
      status: "none registered: no grouping held up across two months"  # a deviation from the phase plan
    action:
      basis: best action for this customer under the base scenario, no budget
      fields: [action, retained_value, net_value, cost]
      required:  # a test fails any response whose action block lacks one of these
        effect_basis: assumed
        scenario: [form, level, margin, cost_level, discount_cost_rule, value_horizon, budget]
        instability_note: "The plan is unstable under 5 of 11 variants."
        no_estimate_line: "No KKBox effect estimate exists; every effect is an assumption."
      plan_membership: batch fact, returned by GET /at-risk
    model_block: [model ids, model SHA-256, config SHA-256]

  outside_population:  # HTTP 200; no probability, reason, lapse-free days or action
    status: outside_population
    codes: [segment_trial_only, segment_promo_only, expiry_beyond_30_days, "unseen_level:<feature>"]
    unseen_level: refused, never guessed
    with: next_expiry_in_days
    null_feature_values: in population  # models trained with native missing values and the masking rule
    limit: "customers expiring more than 30 days ahead (22% of active customers on 2016-11-01) get no score"
  not_active:
    status: not_active  # a known customer with no coverage at the store's date

  december_2016:
    scores: returned with a data warning about the 2016-12-05 missing-renewal day
    reasons: withheld, code "2016-12 not explained"

  errors:
    404: unknown customer
    422: malformed input
    409: as_of differs from the store's date
    503: not ready; a model checksum mismatch stops startup and /health says why

  never_in_any_body: [age, gender, registered_via, tenure, city]  # scanned in every response, error bodies included

streaming:
  meaning: >-
    replay of real 2016 rows in a fixed date order; events arrive one at a time;
    the store's date moves only at snapshot boundaries, so scores change once per
    snapshot (no live source; no daily store dates)
  transport: valkey streams  # BSD-3; one container for stream and store; version pinned at the build plan
  sources:
    - data/interim/kkbox/sample_020/transactions.parquet
    - data/interim/kkbox/sample_020/transactions_v2.parquet
    - data/interim/kkbox/sample_020/user_logs.parquet
  bootstrap:
    snapshot: "2016-10-01"
    built_from: rows dated before 2016-10-01 only
  replay:
    first_day: "2016-10-01"
    last_day: "2016-10-31"
    store_date_after: "2016-11-01"
    stop_at_source: no row dated 2016-11-01 or later is read  # spy test on the source reader
    never: [read any outcome column, construct TestUnlock, run score-test]
    speed: configurable
  tie_rule: >-
    event date; source rank transactions, transactions_v2, user_logs; msno; then
    every column of the row in file order, ascending, nulls first; the producer
    numbers events in this order
  consumer: >-
    per event: 28-day ring of daily usage, first and last listen day, appended
    transaction rows, touched set; at a store-date move: coverage state for touched
    customers by the existing timeline code, cohort median over all customers with
    coverage, date-relative features for everyone

  pass_marks:  # any failure: not met, largest difference reported, no loosening
    event_count:
      recount: a logged step, run once before the replay is judged
      expected: 3727472  # 3,511,773 user_logs + 212,092 transactions + 3,607 transactions_v2
      produced_equals_recount: exact
      consumed_equals_recount: exact
    feature_parity:
      snapshot: "2016-11-01"
      rows: 230286  # every customer with coverage, not a sample
      against: data/processed/kkbox/sample_020/features.parquet
      exact: [integer, category, date, boolean, empty positions]
      float_relative_tolerance: 1.0e-12  # above it: not met, largest difference reported
      labels_state_failure: reported as a finding about Phase 2; the streaming side is not tuned to match
    score_parity:
      population: P2 main
      rows: 169673
      path: the scoring function the API uses
      raw_scores: identical wherever features are identical
      final_probability_tolerance: 1.0e-12
      http_sample: {customers: 1000, seeded: true, answers: identical}
    determinism:
      runs: [full speed, throttled]
      compare: feature table hash
      required: identical
    resources:
      peak_rss_gb_max: 10  # every process
      reported_only: [replay time, valkey memory]
    latency:
      endpoint: POST /score over HTTP to the running stack, this Mac
      warmup_calls: 50
      calls: 1000  # sequential, seeded customers of the training population
      p95_ms_max: 100  # the user's own unvalidated choice, not based on any measurement
      reported: [p50, p99]
      ci: not measured

api:
  # Every label below is a required fixed-value field in the response schemas; a
  # response missing one fails as a 500, never as a partial answer.
  models:
    source: MLflow registry
    alias: serving
    registered: [c01 7 days, c01 30 days, c01 59 days, dt01, calibration files]  # by a logged step after the 59-day refit passes
    checksum: SHA-256 of every file against this config; any mismatch refuses startup

  at_risk:
    endpoint: GET /at-risk
    horizon: {allowed: [7, 30, 59], default: 30}
    limit: {default: 50, max: 1000}
    offset: true
    filters: [auto_renew, in_plan]  # nothing else
    order: final probability at the horizon, descending; ties by msno
    plan_cell: {strategy: optimizer, scenario: base, budget: 5000}
    plan_label: "plan built from the 30-day probability before the ordering fix"  # on every plan field
    replanning: none in this phase
    header_note: "Ranking uses the final probability; plan membership comes from the Phase 7 plan."
    header_counts: [scored, outside_population by code, not_active]
    no_plan_status: "no plan for this date"

  alerts:
    endpoint: GET /alerts
    kinds: [trend, event]
    trend:
      source: data/processed/kkbox/sample_020/trends/alerts_run.json
      knowable_rule: week start + 37 days on or before the store's date
      hidden_dimensions: [city, registration_channel, tenure]  # removed from top segments and dimension totals; the number hidden is shown
      labels:
        - "exploratory"
        - "false-alarm rate not validated"
        - "detected in hindsight on the series through 2016-12-19"
      keep: stored data-quality flags
    event:
      what: each cancel row from a customer scored at the store's date, during replay
      label: "a cancel row, not a change in risk"
      rescoring: none until the next store-date move

  health:
    endpoint: GET /health
    fields: [ready, store_date, replay_progress, model_checksums_match, config_sha256, valkey_reachable]
    replay_expected_events: 3727472
    not_ready: 503

wording:
  extends: configs/actions.yaml wording_rules  # the Phase 7 list and prefix stay in force
  scope: [README.md section Scoring service, docs/scoring_api.md, reports/serving_parity.md, every fixed string in API responses]
  fixed_disclaimers:  # used verbatim
    - "The service replays 2016 KKBox data; there is no live source."
    - "Customers expiring more than 30 days ahead (22% of active customers on 2016-11-01) get no score."
    - "Plans exist for two dates only (2016-10-01 and 2016-11-01) and were built from the 30-day probability before the ordering fix."
    - "KKBox backtest figures are model estimates under assumed effects, not observed outcomes."
  banned_words:  # whole words, case-insensitive, in addition to the Phase 7 list
    - real-time
    - production
    - live
    - identical
  live_exception: "The service replays 2016 KKBox data; there is no live source."  # exact string only; a second use of "live" fails
  identical_exception: raw scores where features are identical  # the registered mark; banned for any other float comparison
  horizon_59:
    say: "59 days"
    never: "60 days"  # except in the one sentence stating the deviation from the phase plan
    probability_carries: "demonstration"
  parity_sentence: "the same scores as batch within the registered tolerance"  # names the tolerance
  latency_sentence: "p95 on this Mac, one run of 1,000 calls"  # never a general speed claim
  latency_threshold_label: "my unvalidated choice"  # wherever the 100 ms threshold appears
  never_used: [age, gender, registered_via, tenure, city]  # never a segment, filter or reason in any doc
