# Phase 8: scoring service. Registered before any Phase 8 code or run.
# Committed alone. The first commit registers the ordering fix and the 59-day
# refit; later sections are added in their own commits, each before the code or
# run it judges. No value here is changed after a result is seen: a later change
# is a logged amendment, and results under the original values are reported too.
# The scoring contract and the streaming pass marks were added in the second
# commit, before any build.
# The API labels and the wording rules were added in the third commit, before any
# build.
# Amendment A1 to the fix mark was added in the fourth commit, after the first
# refit59 run showed it was mis-specified, and verified by a reconciliation run.
# The saved 59-day files' SHA-256 values were added in the fifth commit, after the
# save run: an addition beyond the original marks.
# The saved 7-day and 30-day model JSON hashes were added in the sixth commit, hashed
# as the files stood on disk: an addition beyond the original marks.
# Contract amendment A2 (the misnamed lapse-free days field) was added in the
# seventh commit, before any code serves the field.
# The saved dt01 hashes, the registry section and the step 4 reload marks were
# added in the eighth commit, before any registry or scoring code.
# Step 4's design choices and five more marks were added in the ninth commit,
# before any scoring code.
# Amendment A3 (tenure never shown as a reason) was added in the tenth commit,
# before any reasons code.
# Contract amendment A4 (how the action block reads) was added in the eleventh
# commit, before any schema or label code.
# Step 5's choices (known customers, the store, the ranking, the scan, the tests,
# the pins and the generated docs) were added in the twelfth commit, before any
# step 5 code.
#
# Every pass mark is exact unless a tolerance is written next to it. If a
# reproduction field differs, the step stops and reports the largest difference;
# row order, library versions and thread count are examined first. No tolerance
# is introduced afterwards.

ordering:
  # The ordering fix registered in Phase 3, unchanged.
  horizons: [7, 30, 59]  # lapse by day 59, not 60 (a deviation from the phase plan's 60 days)
  order: [calibrate, clip, pool_adjacent_violators, clip]
  clip: [1.0e-6, 0.999999]
  pav_weights: equal
  property: "p7 <= p30 <= p59 on every row after the fix"

  refit_59:
    model: c01  # inherits the 30-day fold's choice; no fold chose settings at 59 days
    feature_set: fs1
    target: lapse by day 59
    fit_snapshots: ["2016-08-01", "2016-09-01"]
    fit_population: P2 main
    labels_as_of: "2017-01-01"  # cached labels only; no label building
    threads: 4
    seed: 20161001
    never: [read any 2017 outcome, construct TestUnlock, run score-test]
    status: demonstration-grade  # no fold chose its settings; calibration judged only in the Phase 3 59-day demonstration

  platt_59:
    slice: calibration half of 2016-10-01, P2 main
    labels_as_of: "2017-01-01"
    caveat: >-
      renewal windows run to 2016-12-29 and include the 2016-12-05 missing-renewal
      day; a customer whose renewal was due that day can be counted as lapsed, so
      these values may be slightly high (size not estimated)

  pass_marks:
    reproduction:
      source: data/processed/kkbox/sample_020/rehearsal.json
      source_sha256: 79cf47d49831d1e0cd0c1009816abd963d810d7867bf852431ba0bdb43a16ca6
      key: "demonstration_59 / 59 days, 2016-11-01 / models / classifier / score_summary_raw"
      snapshot: "2016-11-01"
      population: P2 main
      fields: 13  # mean, 9 deciles, min, max, distinct
      tolerance: exact
      expected:
        mean: 0.06730564963246764
        deciles:
          - 0.011126644718503055
          - 0.013732393068438547
          - 0.016551046580978244
          - 0.01875006284396744
          - 0.023477007922971263
          - 0.030022366348082582
          - 0.03792667875747765
          - 0.06816764329627534
          - 0.16823298746746904
        min: 0.008868385191557537
        max: 0.9539826748681025
        distinct: 93640
    platt_59:
      source: MLflow run 9bca205ae00b4017a440d16057fa60e8, artifact october.json, classifier_c01.platt.59
      tolerance: exact
      a: 0.02725170409239291
      b: 1.0132027145157536
    fix:
      snapshot: "2016-11-01"
      population: P2 main
      rows: 169673
      models: {7: saved booster, 30: saved booster, 59: refit}
      rows_changed: 16444  # exact
      max_change: 0.300535285645459
      max_change_tolerance: 1.0e-12
    determinism:
      in_process_refits: 2  # identical booster string required
      save: second run with the expected SHA-256 only
      serving: refuse any model file whose SHA-256 differs from the registered one
    monotone:
      property_test: seeded random inputs; every row satisfies p7 <= p30 <= p59
      real_check: every 2016-11-01 P2 main row after the fix; stop on any violation

  descriptive:  # no pass mark
    calibration_before_after_fix:
      horizons: [7, 30]
      slice: selection half of 2016-10-01, P2 main (72,395 rows)
      labels_as_of: "2017-01-01"  # 2016 outcomes only
      report: [slope, intercept]

  amendments:
    - id: A1
      date: "2026-10-18"
      label: >-
        fixed after seeing the count; verified by the reconciliation; the original
        fix mark was mis-specified and is reported as not met as written
      amends: pass_marks.fix.rows_changed  # 16444 stays as registered; it is not edited
      finding: >-
        the logged 16444 covers all 178594 P2 rows of 2016-11-01, trial-only and
        promo-only included; on the 169673 training-population rows the fix
        changes 7632; the 8921 out-of-population rows account for the other 8812
      reconciliation:  # one diagnostic run at 661e135, before this entry
        all_p2_rows: 178594
        all_p2_rows_changed: 16444
        main_rows_changed: 7632
        out_of_population_rows: 8921
        out_of_population_rows_changed: 8812  # trial_only 8796 of 8890, promo_only 16 of 31
        largest_change_row_segment: paid
      mark:  # replaces only the rows-changed comparison; every other fix mark stands
        training_population:
          rows: 169673
          rows_changed: 7632  # exact
        all_p2_tie:  # the logged figures, recomputed on the row set they came from
          rows: 178594
          rows_changed: 16444  # exact
          share_changed: 0.09207476175011478  # exact
          mean_change_changed_rows: 0.014105477095603738  # exact
          max_change: 0.300535285645459  # within the registered 1e-12
          order_violations_after_fix: 0

  saved_59:
    label: >-
      an addition beyond the original marks, registered after the save run; the
      service refuses either file if its SHA-256 differs
    directory: data/interim/kkbox/sample_020/serving/model
    files:
      booster_59d.txt: 21f7240dce242d3a53287cee502742431c1747b88d23d6259d7ab7709d81d13a
      model_59d.json: e1b4bbc70fb8183921b374cd9498f1e80249d52df4517e6e42d9d58a29734cb5

  saved_7_30:
    label: >-
      an addition beyond the original marks: the model JSONs saved in Phase 4
      (columns, category levels, Platt a and b), hashed as they stood on disk on
      2026-10-18, not regenerated; the service refuses either file if its SHA-256
      differs
    directory: data/interim/kkbox/sample_020/explain/model
    files:
      model_7d.json: d317109cf938b6518e73be78887befe284f5e9790322933df0250024e8ea525a
      model_30d.json: c78fbc8757ac3176a4ff780bf813cc1faee282ae8873de2c1549527e319fe7bb
    boosters: registered in Phase 4 (booster_7d.txt e1c985c9...a0a26d, booster_30d.txt b967381d...9fcf35d)

  saved_dt01:
    label: >-
      an addition beyond the original marks, registered after the save-dt01 run;
      the service refuses either file if its SHA-256 differs
    directory: data/interim/kkbox/sample_020/serving/model
    files:
      dt01.txt: 6d2edd153b89ba149c46de3f647c0b8900a4e22a66fd365d9c927714c2a7338d  # = Phase 7's optimize/model/dt01.txt
      model_dt01.json: c809fba302b62463756027cada619956f6128044d36b527ce885be9ee68a81a9

  reasons:
    horizons: [7, 30]  # no reasons at 59 days
    explain: the probability before the fix  # said next to the final probability wherever both are shown

contract:
  score_request:
    endpoint: POST /score
    fields: {msno: required, as_of: optional}
    features_from: the service's own store  # callers never post feature values
  store_date: >-
    one date per loaded snapshot; during replay the store holds features for
    exactly one date T, built from rows dated before T
  population: P2 main  # in_exp30 and segment paid or discount100_only

  scored:  # status "scored"
    risk:
      horizons: [7, 30, 59]
      value: after the ordering fix, full precision, plus display text
      grade_59: demonstration
      flag: whether the ordering fix moved this customer's values
    reasons:
      horizons: [7, 30]
      phrases: configs/reason_phrases.yaml
      with: the probability before the fix
      fixed_line: "Reasons explain the probability before the ordering fix."
    lapse_free_days:
      horizon: 60
      model: dt01
      labels:
        - "uncalibrated between 7, 30 and 59 days"
        - "near the ceiling for almost everyone; not a ranking signal"
    archetype:
      value: null
      status: "none registered: no grouping held up across two months"  # a deviation from the phase plan
    action:
      basis: best action for this customer under the base scenario, no budget
      fields: [action, retained_value, net_value, cost]
      required:  # a test fails any response whose action block lacks one of these
        effect_basis: assumed
        scenario: [form, level, margin, cost_level, discount_cost_rule, value_horizon, budget]
        instability_note: "The plan is unstable under 5 of 11 variants."
        no_estimate_line: "No KKBox effect estimate exists; every effect is an assumption."
      plan_membership: batch fact, returned by GET /at-risk
    model_block: [model ids, model SHA-256, config SHA-256]

  outside_population:  # HTTP 200; no probability, reason, lapse-free days or action
    status: outside_population
    codes: [segment_trial_only, segment_promo_only, expiry_beyond_30_days, "unseen_level:<feature>"]
    unseen_level: refused, never guessed
    with: next_expiry_in_days
    null_feature_values: in population  # models trained with native missing values and the masking rule
    limit: "customers expiring more than 30 days ahead (22% of active customers on 2016-11-01) get no score"
  not_active:
    status: not_active  # a known customer with no coverage at the store's date

  december_2016:
    scores: returned with a data warning about the 2016-12-05 missing-renewal day
    reasons: withheld, code "2016-12 not explained"

  errors:
    404: unknown customer
    422: malformed input
    409: as_of differs from the store's date
    503: not ready; a model checksum mismatch stops startup and /health says why

  never_in_any_body: [age, gender, registered_via, tenure, city]  # scanned in every response, error bodies included

  amendments:
    - id: A2
      date: "2026-10-18"
      label: >-
        a misnamed field corrected before any code serves it: the registered
        lapse_free_days text named a quantity that does not exist in the project;
        the figures it cited are Phase 7's days_30_90; not a tuned result
      amends: scored.lapse_free_days  # the registered entry is kept, not edited
      field: expected_paid_days_31_90
      name: "expected paid days in days 31 to 90, given no lapse by day 30"
      definition: >-
        from dt01's raw survival curve S(t) at the interval ends 30 to 90: the
        trapezoid sum of S(t) / S(30) over (30, 90], as Phase 7's expected_days
        computes days_30_90; 0 when S(30) is 0
      model: dt01
      labels:
        - "expected paid days in days 31 to 90, given no lapse by day 30"
        - "dt01 raw survival curve, shape only, no calibration"
        - "near the ceiling for almost everyone; not a ranking signal"
      parity:
        against: data/processed/kkbox/sample_020/optimize/value.parquet, column days_30_90
        snapshots: ["2016-10-01", "2016-11-01"]  # the only snapshots Phase 7 computed
        rows: {"2016-10-01": 144996, "2016-11-01": 169673}
        path: the service's scoring function on batch features, same customer and snapshot
        tolerance: exact

  action_reading:  # amendment A4; a new key, so the registered amendments list stays unchanged
    id: A4
    date: "2026-10-19"
    label: >-
      written before any schema or label code, after counting value.parquet
      through Phase 7's best_action: it has no "none" choice and names the
      allowed action with the highest net value even when that value is
      negative, so an action field alone would read as a recommendation for
      customers where no action pays
    amends: scored.action  # the registered entry is kept, not edited
    field: highest_net_value_action  # replaces the name "action"; never reads as a recommendation
    definition: the allowed action with the highest net value under the base scenario, no budget (Phase 7's best_action, unchanged)
    shown: [highest_net_value_action, expected_retained_value, net_value, cost, pays]
    pays: true only when net_value > 0
    reads_as_when_not_paying: "no action pays"
    cases:
      pays: an action is allowed and its net value is above 0; pays true; no reads_as
      does_not_pay: >-
        an action is allowed but the highest net value is 0 or below; pays false;
        reads_as "no action pays"; the action and its values are still shown
      none_allowed: >-
        no action is allowed (eligibility, lead time, or no usable price);
        highest_net_value_action "none" with expected retained value, net value
        and cost 0; pays false; reads_as "no action pays"; a customer without a
        usable price also carries D2's flag "no usable price"
    never_in_a_block_that_does_not_pay: [recommend]  # a test fails any pays-false response containing it, any letter case
    scenario_text:  # registered wording for the scenario values that had none
      discount_cost_rule: "forgone price counted in full"
      value_horizon: "expected paid days in days 31 to 90"
      budget: "none: each customer's own best action"
    docs_figures:  # from the count in the decision log on 2026-10-19 (value.parquet, Phase 7's code, base scenario)
      "2016-11-01": {blocks_that_pay: 8497, blocks: 169673}
      "2016-10-01": {blocks_that_pay: 9410, blocks: 144996}
    score_parity:
      recount: the blocks that pay, per snapshot, recomputed and reported next to these figures
      no_price_rule: score-parity stops if a customer without a usable price has any allowed action

streaming:
  meaning: >-
    replay of real 2016 rows in a fixed date order; events arrive one at a time;
    the store's date moves only at snapshot boundaries, so scores change once per
    snapshot (no live source; no daily store dates)
  transport: valkey streams  # BSD-3; one container for stream and store; version pinned at the build plan
  sources:
    - data/interim/kkbox/sample_020/transactions.parquet
    - data/interim/kkbox/sample_020/transactions_v2.parquet
    - data/interim/kkbox/sample_020/user_logs.parquet
  bootstrap:
    snapshot: "2016-10-01"
    built_from: rows dated before 2016-10-01 only
  replay:
    first_day: "2016-10-01"
    last_day: "2016-10-31"
    store_date_after: "2016-11-01"
    stop_at_source: no row dated 2016-11-01 or later is read  # spy test on the source reader
    never: [read any outcome column, construct TestUnlock, run score-test]
    speed: configurable
  tie_rule: >-
    event date; source rank transactions, transactions_v2, user_logs; msno; then
    every column of the row in file order, ascending, nulls first; the producer
    numbers events in this order
  consumer: >-
    per event: 28-day ring of daily usage, first and last listen day, appended
    transaction rows, touched set; at a store-date move: coverage state for touched
    customers by the existing timeline code, cohort median over all customers with
    coverage, date-relative features for everyone

  pass_marks:  # any failure: not met, largest difference reported, no loosening
    event_count:
      recount: a logged step, run once before the replay is judged
      expected: 3727472  # 3,511,773 user_logs + 212,092 transactions + 3,607 transactions_v2
      produced_equals_recount: exact
      consumed_equals_recount: exact
    feature_parity:
      snapshot: "2016-11-01"
      rows: 230286  # every customer with coverage, not a sample
      against: data/processed/kkbox/sample_020/features.parquet
      exact: [integer, category, date, boolean, empty positions]
      float_relative_tolerance: 1.0e-12  # above it: not met, largest difference reported
      labels_state_failure: reported as a finding about Phase 2; the streaming side is not tuned to match
    score_parity:
      population: P2 main
      rows: 169673
      path: the scoring function the API uses
      raw_scores: identical wherever features are identical
      final_probability_tolerance: 1.0e-12
      http_sample: {customers: 1000, seeded: true, answers: identical}
    determinism:
      runs: [full speed, throttled]
      compare: feature table hash
      required: identical
    resources:
      peak_rss_gb_max: 10  # every process
      reported_only: [replay time, valkey memory]
    latency:
      endpoint: POST /score over HTTP to the running stack, this Mac
      warmup_calls: 50
      calls: 1000  # sequential, seeded customers of the training population
      p95_ms_max: 100  # the user's own unvalidated choice, not based on any measurement
      reported: [p50, p99]
      ci: not measured

api:
  # Every label below is a required fixed-value field in the response schemas; a
  # response missing one fails as a 500, never as a partial answer.
  models:
    source: MLflow registry
    alias: serving
    registered: [c01 7 days, c01 30 days, c01 59 days, dt01, calibration files]  # by a logged step after the 59-day refit passes
    checksum: SHA-256 of every file against this config; any mismatch refuses startup

  at_risk:
    endpoint: GET /at-risk
    horizon: {allowed: [7, 30, 59], default: 30}
    limit: {default: 50, max: 1000}
    offset: true
    filters: [auto_renew, in_plan]  # nothing else
    order: final probability at the horizon, descending; ties by msno
    plan_cell: {strategy: optimizer, scenario: base, budget: 5000}
    plan_label: "plan built from the 30-day probability before the ordering fix"  # on every plan field
    replanning: none in this phase
    header_note: "Ranking uses the final probability; plan membership comes from the Phase 7 plan."
    header_counts: [scored, outside_population by code, not_active]
    no_plan_status: "no plan for this date"

  alerts:
    endpoint: GET /alerts
    kinds: [trend, event]
    trend:
      source: data/processed/kkbox/sample_020/trends/alerts_run.json
      knowable_rule: week start + 37 days on or before the store's date
      hidden_dimensions: [city, registration_channel, tenure]  # removed from top segments and dimension totals; the number hidden is shown
      labels:
        - "exploratory"
        - "false-alarm rate not validated"
        - "detected in hindsight on the series through 2016-12-19"
      keep: stored data-quality flags
    event:
      what: each cancel row from a customer scored at the store's date, during replay
      label: "a cancel row, not a change in risk"
      rescoring: none until the next store-date move

  health:
    endpoint: GET /health
    fields: [ready, store_date, replay_progress, model_checksums_match, config_sha256, valkey_reachable]
    replay_expected_events: 3727472
    not_ready: 503

wording:
  extends: configs/actions.yaml wording_rules  # the Phase 7 list and prefix stay in force
  scope: [README.md section Scoring service, docs/scoring_api.md, reports/serving_parity.md, every fixed string in API responses]
  fixed_disclaimers:  # used verbatim
    - "The service replays 2016 KKBox data; there is no live source."
    - "Customers expiring more than 30 days ahead (22% of active customers on 2016-11-01) get no score."
    - "Plans exist for two dates only (2016-10-01 and 2016-11-01) and were built from the 30-day probability before the ordering fix."
    - "KKBox backtest figures are model estimates under assumed effects, not observed outcomes."
  banned_words:  # whole words, case-insensitive, in addition to the Phase 7 list
    - real-time
    - production
    - live
    - identical
  live_exception: "The service replays 2016 KKBox data; there is no live source."  # exact string only; a second use of "live" fails
  identical_exception: raw scores where features are identical  # the registered mark; banned for any other float comparison
  horizon_59:
    say: "59 days"
    never: "60 days"  # except in the one sentence stating the deviation from the phase plan
    probability_carries: "demonstration"
  parity_sentence: "the same scores as batch within the registered tolerance"  # names the tolerance
  latency_sentence: "p95 on this Mac, one run of 1,000 calls"  # never a general speed claim
  latency_threshold_label: "my unvalidated choice"  # wherever the 100 ms threshold appears
  never_used: [age, gender, registered_via, tenure, city]  # never a segment, filter or reason in any doc

registry:
  label: registered before any registry code
  tracking_uri: >-
    MLFLOW_TRACKING_URI when set; otherwise the project's store,
    configs/evaluation.yaml tracking.uri (sqlite:///mlruns/mlflow.db)
  registered_model: retention-scoring
  alias: serving
  versions_under_alias: 1  # one version holds every file; horizons are never mixed across versions
  bundle:  # every file is checked against these hashes at registration and at every load
    booster_7d.txt: e1c985c98c87280cf09bf451515e660f2f4b3fbae722cae97c93a02ed2b0a26d
    model_7d.json: d317109cf938b6518e73be78887befe284f5e9790322933df0250024e8ea525a
    booster_30d.txt: b967381d50a3e1f392b5db5281e2326a22799dde79dc8cdce66adb01b9fcf35d
    model_30d.json: c78fbc8757ac3176a4ff780bf813cc1faee282ae8873de2c1549527e319fe7bb
    booster_59d.txt: 21f7240dce242d3a53287cee502742431c1747b88d23d6259d7ab7709d81d13a
    model_59d.json: e1b4bbc70fb8183921b374cd9498f1e80249d52df4517e6e42d9d58a29734cb5
    dt01.txt: 6d2edd153b89ba149c46de3f647c0b8900a4e22a66fd365d9c927714c2a7338d
    model_dt01.json: c809fba302b62463756027cada619956f6128044d36b527ce885be9ee68a81a9
  manifest: >-
    manifest.json beside the eight files, written at registration: each file's
    SHA-256, the git head and this config's SHA-256; at load its file hashes must
    equal the bundle above (the manifest itself is not hashed here, since it holds
    the commit it was written at)
  register: once, clean tree, refused if the alias already exists
  load: >-
    resolve retention-scoring@serving, download the version's files, hash all
    eight against the bundle and check the manifest, then parse; any missing alias,
    missing file or differing hash refuses startup

step4:
  pass_marks:  # registered before any scoring code; exact; any difference stops step 4
    reload_classifier:
      label: the c01 boosters loaded from the saved files through the checked loaders
      snapshot: "2016-11-01"
      population: P2 main
      rows: 169673
      source: data/processed/kkbox/sample_020/rehearsal.json  # SHA-256 registered in ordering.pass_marks.reproduction
      cells:
        - {horizon: 7, path: [primary, "7 days, 2016-11-01", models, classifier, score_summary_raw]}  # added beyond the request; Phase 4 already matched it (13 of 13)
        - {horizon: 30, path: [primary, "30 days, 2016-11-01", models, classifier, score_summary_raw]}  # added beyond the request; Phase 4 already matched it (13 of 13)
        - {horizon: 59, path: [demonstration_59, "59 days, 2016-11-01", models, classifier, score_summary_raw]}
      fields: 13
      tolerance: exact
    reload_dt01:
      label: dt01 loaded from the saved files through load_dt01 (real category levels through JSON tested here first)
      snapshot: "2016-11-01"
      population: P2 main
      rows: 169673
      source: data/processed/kkbox/sample_020/rehearsal.json
      cells:
        - {horizon: 7, path: [primary, "7 days, 2016-11-01", models, survival_dt01, score_summary_raw]}
        - {horizon: 30, path: [primary, "30 days, 2016-11-01", models, survival_dt01, score_summary_raw]}
        - {horizon: 59, path: [demonstration_59, "59 days, 2016-11-01", models, survival_dt01, score_summary_raw]}
      fields: 13
      tolerance: exact
    paid_days_parity:
      label: contract amendment A2's parity, restated here as a step 4 mark
      quantity: expected_paid_days_31_90
      against: data/processed/kkbox/sample_020/optimize/value.parquet, column days_30_90
      against_sha256: a7a67dc7029ec9edbf4f9baf0e42746b8acf696e00e210b678d5a3aacfae2fa3
      snapshots: {"2016-10-01": 144996, "2016-11-01": 169673}
      path: the service's scoring function on batch features, dt01 loaded through load_dt01
      match: same customer and snapshot, every row
      tolerance: exact
    rule: >-
      every step 4 mark is exact; any difference is not met; no tolerance is added
      after a result is seen

  decisions:  # approved by the user before any scoring code
    action_probability:
      choice: the calibrated 30-day probability before the ordering fix, as Phase 7 used it
      label: "computed from the 30-day probability before the ordering fix, as in Phase 7"
      note: >-
        the action block can differ from the final 30-day probability for the 7,632
        training-population rows of 2016-11-01 that the fix moves; stated in the
        response schema and the docs
    no_usable_price:
      choice: Phase 7's arithmetic unchanged (the customer is valued at 0)
      flag: "no usable price"
      reads_as: "no action pays"
      counts: {"2016-10-01": 270, "2016-11-01": 343}  # value.parquet has_price false
    in_exp30:
      batch: labels.parquet, columns in_exp30 and segment only (known at T)
      stream: derived by the consumer; judged by the streaming parity marks in step 6

  more_pass_marks:  # registered before any scoring code; exact; see pass_marks.rule
    reasons_parity:
      against: data/processed/kkbox/sample_020/explain/reasons.parquet
      against_sha256: 6355299aa931b29131933edb48a0cee54bf9387fcdd7602d868b4105250faac8
      rows: {"2016-10-01": 144996, "2016-11-01": 169673}  # per horizon
      horizons: [7, 30]
      columns: every column of reasons.parquet (36)
      match: same customer, snapshot and horizon; every row; floats equal as floats, text equal as text
    final_probability_tie:
      snapshot: "2016-11-01"
      rows: 169673
      rows_changed: 7632  # amendment A1, through the service path
      max_change: 0.300535285645459
      max_change_tolerance: 1.0e-12  # the registered fix tolerance, unchanged
      order_violations_after_fix: 0
    action_parity:
      against: >-
        Phase 7's build_options and best_action under the base scenario, no budget,
        recomputed from value.parquet (pinned in pass_marks.paid_days_parity)
      snapshots: {"2016-10-01": 144996, "2016-11-01": 169673}
      fields: [action, retained_value, net_value, cost]
      match: same customer and snapshot, every row
    population_counts:
      snapshot: "2016-11-01"
      recomputed_in_run: true  # any difference stops the run
      expected:
        scored: 169673
        outside_population_segment_trial_only: 8890
        outside_population_segment_promo_only: 31
        outside_population_expiry_beyond_30_days: 51692
        total_with_coverage: 230286
    unseen_levels:
      snapshot: "2016-11-01"
      population: P2 main
      expected: 0  # every category feature
    run:
      command: score-parity
      once: true  # a second run is refused
      report: data/processed/kkbox/sample_020/serving/step4_report.json

  amendments:
    - id: A3
      date: "2026-10-19"
      label: >-
        written before any reasons code, after a conflict between two registered
        rules was found by counting reasons.parquet: Phase 4 registered tenure as a
        reason group when known; the Phase 6 and Phase 7 handoffs and this
        contract's never_in_any_body say tenure is never a reason; the later rule
        is kept
      amends: more_pass_marks.reasons_parity  # the registered entry is kept, not edited
      original_mark: "amended before any run; not judged as written"
      service_rule: >-
        tenure is masked as not shown, through Phase 4's own shown_only_when_known
        mechanism (the one it uses when tenure_days is missing); its contribution
        goes into "other factors"; Phase 4's selection and renderer run unchanged
      untouched: [configs/explain.yaml, configs/reason_phrases.yaml, data/processed/kkbox/sample_020/explain/reasons.parquet]
      counts:  # reasons.parquet rows listing tenure as a reason (counts only, no outcome)
        "2016-10-01": {"7": 526, "30": 5674}
        "2016-11-01": {"7": 649, "30": 4519}
        total_listed: 11368
        total_rows: 629338
        not_listed: 617970
      mark:
        parity_rows_without_tenure:
          rows: 617970  # where Phase 4 listed no tenure reason
          against: data/processed/kkbox/sample_020/explain/reasons.parquet  # SHA-256 as registered in reasons_parity
          columns: every column of reasons.parquet (36)
          tolerance: exact
        self_check_rows_with_tenure:
          rows: 11368  # where Phase 4 listed tenure
          against: >-
            Phase 4's own select and renderer run on the same rows with tenure
            masked as not shown, computed separately in the run (no Phase 4 file
            holds this output)
          columns: every column of reasons.parquet (36)
          tolerance: exact
          name: self-check
        zero_tenure:
          tenure_slots: 0  # no raising or lowering slot holds the group tenure, in any served row
          member_for_texts: 0  # no served reason text contains "member for"
      expectation_unmeasured: >-
        masking tenure should leave every row where Phase 4 did not list it
        unchanged, because the selection picks only among listed groups and an
        unlisted group already sits in "other factors"; this has not been measured
        and the parity mark on the 617,970 rows is what tests it
      rule: any difference is not met; no tolerance is added after a result is seen

  descriptive:  # no pass mark; reported in step4_report.json
    before_fix_paths:
      what: >-
        rows whose probability before the fix differs between the two registered
        numeric paths (Phase 4's platt_probability on the raw log-odds, used by
        reasons and the action block; Phase 3's calibrate on the predicted
        probability, used by the final probabilities)
      snapshots: ["2016-10-01", "2016-11-01"]
      horizons: [7, 30]
      comparison: exact float equality, no tolerance; the count of differing rows and the largest difference are reported

step5:
  label: approved by the user and registered before any step 5 code
  known_customers:  # Q1 (a)
    definition: a customer with at least one transaction dated before the store's date (data before T only)
    unknown: >-
      404 "unknown customer", including a customer registered in the members file
      who never transacted before the store's date
    not_active: a known customer with no coverage at the store's date
    counts:  # 20% sample, counts only
      "2016-11-01":
        known: 425520
        with_coverage: 230286  # every one of them is known
        not_active: 195234  # 425,520 - 230,286
        members_row_without_a_transaction_before_t: 1006400  # these get 404
  store:  # Q2 (a): the real Valkey, through the redis client
    url: VALKEY_URL
    one_store_date: loading a snapshot replaces every key of the previous one
    keys:
      store_date: "rs:store_date"
      customer: "rs:customer:<msno>"  # one JSON document: model, value and fact columns, status, next_expiry_in_days, price
      known: "rs:known"  # set of known msno
      rank: "rs:rank:<horizon>"  # sorted set of scored msno by final probability, horizons 7, 30, 59
      counts: "rs:counts"  # the /at-risk header counts
      events: "rs:events:cancel"  # cancel rows, filled by the replay in step 6; empty before it
      replay: ["rs:replay:produced", "rs:replay:consumed"]
    floats: written and read back exactly (a float survives the JSON round trip unchanged)
  at_risk_ranking:  # Q3 (a)
    computed: once per loaded snapshot, by the step 4 scoring function, stored as sorted sets
    order: final probability at the horizon, descending; ties by msno ascending
  equalities:  # tested, condition 2
    score: a /score answer equals the batch scoring function's output for the same customer
    at_risk: /at-risk rows equal the stored ranking
  scan:  # Q4 (a)
    where: tests over every endpoint's responses, error bodies included; then the step 8 HTTP sample of 1,000 customers
    runtime_guard: none
  tests:  # condition 1
    valkey_backed: >-
      marked as needing Valkey; in CI (CI=true) a skipped Valkey-backed test fails
      the run; locally they skip only with a stated reason when VALKEY_URL is not
      reachable
  pins:
    plans:
      path: data/processed/kkbox/sample_020/optimize/plans.parquet
      sha256: 93e35aecb65b3030961fe318f2b7128f37617a6b8664b42df74cdcef98da534c
    alerts:
      path: data/processed/kkbox/sample_020/trends/alerts_run.json
      sha256: 1b0b16f912a0f3814e49d49d138945b6d59354d98635e859122534554833da9e
  alerts:  # condition 4, as registered in api.alerts
    trend_knowable_at_2016_11_01: 7  # of 10
    shown: the number of segments hidden by rule, and the three registered labels, on every trend alert
    event_label: "a cancel row, not a change in risk"
  plan_fields:  # condition 3, as registered in api.at_risk
    every_plan_field: "plan built from the 30-day probability before the ordering fix"
    header_note: "Ranking uses the final probability; plan membership comes from the Phase 7 plan."
  docs:
    file: docs/scoring_api.md
    generated_by: python -m retention.api write-docs, from configs/serving.yaml and the response schemas
    test: the committed file equals the generated one and passes the wording rules
    must_state:
      - a customer registered in the members file who never transacted before the store's date gets 404
      - 195,234 of the 425,520 known customers are not_active at 2016-11-01
      - the action block is computed from the 30-day probability before the ordering fix, as in Phase 7, and can differ from the final probability for the 7,632 rows the fix moves on 2016-11-01
      - expected paid days in days 31 to 90, given no lapse by day 30 (amendment A2)
      - tenure is never shown as a reason; Phase 4's reasons file, docs and phrases stay untouched
      - the self-check shows only that the masking matches Phase 4's own missing-tenure behaviour, not that the wording is validated
      - 8,497 of 169,673 action blocks pay on 2016-11-01 and 9,410 of 144,996 on 2016-10-01 (amendment A4)
      - three strings are derived in labels.py (the December 2016 withheld code and warning, and the status "scored")
      - customers expiring more than 30 days ahead (22% of active customers on 2016-11-01) get no score
      - every 59-day probability is a demonstration
  smoke_5f:  # condition 6
    status: not a mark; its numbers are never quoted as parity or latency

unseen_level_codes:  # amendment A5; a new key, so the registered contract stays unchanged
