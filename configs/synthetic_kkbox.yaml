# Synthetic data profile: the pipeline settings for the synthetic dataset (configs/ops.yaml, R3).
# Synthetic data generated by hand-set rules; it is not KKBox data and says nothing about KKBox
# customers. These calendar and model settings were set by hand for a small dataset, with no
# KKBox file, report or model behind them; they are not registered pass marks. They mirror the
# structure of configs/kkbox.yaml so the same label and feature code reads the synthetic tables.

synthetic: true

data:
  interim_dir: data/synthetic/interim
  sample_fraction: 1.0  # selects the folder name sample_100 under interim and processed

labels:
  processed_dir: data/synthetic/processed
  renewal_window_days: 30
  as_of: 2016-12-31
  followup_cap_days: 90
  horizons: [7, 30, 60]
  snapshots:
    start: 2016-06-01
    end: 2016-11-01
    freq: MS
    allow_partial: true
  snapshot_includes_same_day_rows: false
  data_start: 2016-01-01
  left_truncation_days: 410
  lookback_days: 28
  data_quality:
    first_month: 2016-01
    last_month: 2016-12
    listening_days: [31, 45]
    listening_min_active_days: 5
    returns_days: [31, 90]
    batch_baseline_days: 25
    mad_k: 3.0
    sensitivity: 0.25
    min_assessed: 3
    unreliable_failures: 2
  trial_max_coverage_days: 21
  placeholder_expiry_before: 2004-01-01
  far_future_expiry_after: 2018-12-31
  placeholder_coverage_days:
    13: {195: 195}  # never used: the generator writes no placeholder expiry

training:  # hand-set for a few thousand rows; not the registered KKBox classifier settings
  fit_snapshots: [2016-07-01, 2016-08-01]
  score_snapshot: 2016-09-01
  horizons: [7, 30, 59]  # 59: the third probability the drift report compares
  num_leaves: 7
  n_estimators: 60
  learning_rate: 0.1
  min_child_samples: 20
  seed: 20261024
  threads: 2

drift:  # hand-set analogue of the registered KKBox replay (configs/ops.yaml, R1); synthetic only
  reference_fit_snapshots: [2016-07-01, 2016-08-01]  # features: the fit months
  reference_prediction_snapshot: 2016-09-01  # predictions: a month the classifiers were not fit on
  current_snapshot: 2016-10-01  # the store date of the synthetic replay
  shift_first_day: 2016-09-01  # listening halved in the month before the store date
  shift_last_day: 2016-09-30
  batch_reference_month: 2016-08  # daily event counts for the band
  batch_current_month: 2016-09
